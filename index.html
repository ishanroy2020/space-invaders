<!DOCTYPE html>
<html lang="en">
<head>

<style>
  /* Press Start 2P by CodeMan38 - SIL Open Font License 1.1. Self-hosted so it also loads where Google Fonts is blocked. */
  @font-face { font-family: 'Press Start 2P'; src: url('fonts/press-start-2p.woff2') format('woff2'); font-display: swap; }
  :root {
    --bg: #05010f; --ink: #e8f7ff; --dim: #8a86b5;
    --green: #39ff14; --cyan: #00e5ff; --pink: #ff2bd6; --yellow: #ffe600; --red: #ff3355;
    --font: 'Press Start 2P', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--font);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    touch-action: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: radial-gradient(ellipse at 50% 120%, #2a0845 0%, var(--bg) 62%);
  }
  #stage { position: relative; overflow: hidden; width: 100%; height: 100%; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #crt {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.5) 100%);
  }

  .screen {
    position: absolute; inset: 0; z-index: 3; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px 16px; text-align: center;
  }
  .screen.show { display: flex; animation: pop .22s steps(4) both; }
  .screen.dim { background: rgba(4,1,12,.45); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  /* Sci-fi glass panel with chamfered corners and corner brackets */
  .panel {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px;
    width: min(440px, 100%); padding: 28px 20px;
    background: linear-gradient(180deg, rgba(16,28,60,.82), rgba(6,4,22,.9));
    border: 1px solid rgba(0,229,255,.35);
    box-shadow: inset 0 0 40px rgba(0,229,255,.08), 0 0 40px rgba(0,0,0,.5);
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  }
  .panel::before, .panel::after { content: ''; position: absolute; width: 22px; height: 22px; border: 2px solid var(--cyan); pointer-events: none; }
  .panel::before { top: 7px; left: 7px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: 7px; right: 7px; border-left: 0; border-top: 0; }
  .logo, .tag, .best, #menu .small { text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 2px #000; }
  .logo span { text-shadow: 0 0 6px currentColor, 0 0 26px currentColor, 4px 4px 0 #3b0a66, 0 4px 14px #000; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  h2 { font-size: clamp(18px, 6vw, 28px); font-weight: normal; color: var(--cyan); text-shadow: 0 0 8px currentColor, 0 0 22px currentColor; line-height: 1.3; }
  h2.red { color: var(--red); }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 12px; line-height: 1; font-weight: normal; }
  .logo span { font-size: clamp(30px, 11vw, 64px); text-shadow: 0 0 6px currentColor, 0 0 26px currentColor, 4px 4px 0 #3b0a66; }
  .logo .l1 { color: var(--cyan); }
  .logo .l2 { color: var(--pink); animation: flicker 6s infinite; }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .4; } 94% { opacity: 1; } 96% { opacity: .6; } }
  .tag { font-size: 10px; color: var(--dim); letter-spacing: 2px; }
  .small { font-size: 9px; color: var(--dim); line-height: 1.9; }
  .best { font-size: 11px; color: var(--yellow); }
  .blink { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .btn {
    font: inherit; font-size: 12px; letter-spacing: 1px; color: var(--ink);
    background: rgba(255,255,255,.03); border: 3px solid currentColor;
    padding: 14px 16px; min-height: 50px; min-width: 132px; cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,229,255,.35); touch-action: manipulation;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 rgba(0,229,255,.35); }
  .btn.primary {
    color: var(--bg); background: var(--green); border-color: var(--green); font-size: 16px;
    padding: 18px 34px; min-width: 220px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--green), 0 0 30px rgba(57,255,20,.55);
  }
  .btn.primary:active { transform: scale(.97); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .locked { pointer-events: none; }
  .locked .btn { opacity: .45; }

  .legend { display: flex; gap: 22px; align-items: flex-end; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .legend div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 9px; color: var(--dim); }
  .legend img { image-rendering: pixelated; display: block; }

  #pauseBtn {
    position: absolute; top: 6px; right: 6px; z-index: 3; width: 46px; height: 46px; display: none;
    font: inherit; font-size: 12px; color: var(--ink); background: rgba(5,1,15,.35);
    border: 2px solid rgba(232,247,255,.45); touch-action: manipulation; cursor: pointer;
  }
  body[data-state="play"] #pauseBtn { display: block; }
  [hidden] { display: none !important; }
  #bombBtn {
    position: absolute; right: 10px; bottom: 34%; z-index: 3; display: none;
    min-width: 72px; height: 46px; padding: 0 10px; font: inherit; font-size: 11px; cursor: pointer;
    color: var(--pink); background: rgba(255,43,214,.12); border: 3px solid var(--pink);
    box-shadow: 0 0 16px rgba(255,43,214,.6); touch-action: manipulation;
    animation: pulse .9s ease-in-out infinite alternate;
  }
  body[data-state="play"] #bombBtn.ready { display: block; }
  @keyframes pulse { from { box-shadow: 0 0 6px rgba(255,43,214,.4); } to { box-shadow: 0 0 22px rgba(255,43,214,.9); } }
  .btn.cont {
    color: var(--bg); background: var(--yellow); border-color: var(--yellow); font-size: 12px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--yellow), 0 0 26px rgba(255,230,0,.5);
  }
  .btn.cont:active { transform: scale(.97); }
  #contNote { margin-top: -8px; }

  .kbd-only { display: none; }
  @media (hover: hover) and (pointer: fine) { .touch-only { display: none; } .kbd-only { display: block; } }

  .score-big { font-size: clamp(26px, 9vw, 44px); color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
  .badge { color: var(--pink); font-size: 11px; display: none; }
  .badge.show { display: block; }
  #saveForm { display: none; gap: 10px; align-items: stretch; }
  #saveForm.show { display: flex; }
  #nameInput {
    font: inherit; font-size: 16px; width: 9.5em; padding: 12px 10px; text-align: center; text-transform: uppercase;
    color: var(--green); background: rgba(57,255,20,.06); border: 3px solid var(--green); border-radius: 0;
    -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none;
  }
  #nameInput::placeholder { color: rgba(57,255,20,.4); }
  #saveForm .btn { min-width: 0; }
  #savedMsg { font-size: 10px; color: var(--green); min-height: 10px; }

  #scoreList { list-style: none; width: min(340px, 100%); font-size: 11px; }
  #scoreList li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 4px; border-bottom: 2px dashed rgba(138,134,181,.3); }
  #scoreList li span:first-child { color: var(--dim); width: 3ch; text-align: left; }
  #scoreList li span:nth-child(2) { flex: 1; text-align: left; }
  #scoreList li:first-child { color: var(--yellow); }
  #scoreList li.me { color: var(--green); }

  /* Short screens: phones held sideways */
  @media (max-height: 520px) {
    .screen { gap: 10px; padding: 12px 16px; }
    .panel { gap: 8px; padding: 14px 16px; }
    .logo { flex-direction: row; gap: 18px; }
    .logo span { font-size: 30px; }
    .legend, .tag, #tip { display: none; }
    h2 { font-size: 18px; }
    .score-big { font-size: 24px; }
    .btn { padding: 10px 14px; min-height: 44px; }
    .btn.primary { padding: 12px 26px; font-size: 14px; }
    #scoreList li { padding: 4px; font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.show, .logo .l2, .blink, #bombBtn { animation: none; }
  }
</style>
</head>
<body data-state="menu">
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Game screen"></canvas>
    <div id="crt"></div>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <button id="bombBtn" aria-label="Smart bomb">BOMB</button>

    <section id="menu" class="screen show">
      <h1 class="logo"><span class="l1">PIXEL</span><span class="l2">SIEGE</span></h1>
      <p class="tag">DEFEND THE SOLAR SYSTEM</p>
      <button class="btn primary" id="playBtn">PLAY</button>
      <div class="row">
        <button class="btn" id="scoresBtn">SCORES</button>
        <button class="btn" id="soundBtn">SOUND ON</button>
        <button class="btn touch-only" id="ctrlBtn">2 THUMBS</button>
      </div>
      <p class="best">BEST <span id="bestVal">0</span></p>
      <p class="small touch-only" id="howto"></p>
      <p class="small kbd-only">ARROWS OR A/D MOVE - SPACE FIRE<br>B SMART BOMB - P PAUSE</p>
      <div class="legend" id="legend"></div>
      <p class="small" id="tip" hidden></p>
    </section>

    <section id="pause" class="screen dim">
      <div class="panel">
      <h2>PAUSED</h2>
      <button class="btn primary" id="resumeBtn">RESUME</button>
      <div class="row">
        <button class="btn" id="soundBtn2">SOUND ON</button>
        <button class="btn touch-only" id="ctrlBtn2">2 THUMBS</button>
        <button class="btn" id="quitBtn">QUIT</button>
      </div>
      </div>
    </section>

    <section id="over" class="screen dim">
      <div class="panel">
      <h2 class="red">GAME OVER</h2>
      <p class="score-big" id="finalScore">0</p>
      <p class="badge" id="newBest">* NEW BEST *</p>
      <p class="small" id="waveReached"></p>
      <form id="saveForm" autocomplete="off">
        <input id="nameInput" maxlength="8" placeholder="NAME" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your name">
        <button class="btn" type="submit">SAVE</button>
      </form>
      <p id="savedMsg"></p>
      <button class="btn cont" id="contBtn">CONTINUE WAVE <span id="contWave">1</span> (<span id="contSec">9</span>)</button>
      <p class="small" id="contNote">KEEP YOUR WAVE - SCORE RESETS TO 0</p>
      <div class="row">
        <button class="btn primary" id="againBtn">PLAY AGAIN</button>
        <button class="btn" id="menuBtn">MENU</button>
      </div>
      </div>
    </section>

    <section id="scores" class="screen dim">
      <div class="panel">
      <h2>HIGH SCORES</h2>
      <ol id="scoreList"></ol>
      <button class="btn" id="backBtn">BACK</button>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d', { alpha: false });
const app = $('app'), stage = $('stage');
const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';
const PIXEL = 3;
const DRAG_GAIN = 1.35;   // ship moves a little further than the finger, so short thumb swipes cover the screen
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isWeChat = /MicroMessenger/i.test(UA);
const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pad = (n, l = 6) => String(n).padStart(l, '0');
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

const store = {
  get(k, d) { try { const v = localStorage.getItem('ps_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ps_' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- sprites (original designs) ----------
const S = s => s.trim().split(/\s+/).map(r => [...r].map(Number));
const SPRITES = {
  ship:     S('00000100000 00001110000 00001010000 00011111000 10111111101 11111111111 11011111011 10000100001'),
  watcherA: S('0011111100 0111111110 1110000111 1100110011 1110000111 0111111110 0010000100 0100000010'),
  watcherB: S('0011111100 0111111110 1110000111 1101100011 1110000111 0111111110 0010000100 0001001000'),
  botA:     S('00000100000 00001110000 01111111110 01000000010 01011011010 01000000010 01111111110 00100000100'),
  botB:     S('00000000000 00000100000 01111111110 01000000010 01011011010 01000000010 01111111110 01000000010'),
  mothA:    S('1100000011 1110110111 0111111110 0011001100 0011111100 0001111000 0010000100 0100000010'),
  mothB:    S('0000000000 0000110000 1111111111 1111001111 0111111110 0001111000 0010000100 0001001000'),
  carrier:  S('0000001111000000 0000011001100000 1000111111110001 1111111111111111 0110110000110110 0010000000000100'),
  laser:    S('1 1 1 1'),
  boltA:    S('010 100 010 001 010 100'),
  boltB:    S('010 001 010 100 010 001'),
  burst:    S('00100000100 10010001001 01000100010 00011011000 01000100010 10010001001 00100000100'),
  barrier:  S('0000011111100000 0001111111111000 0111111111111110 1111111111111111 1111111111111111 0111111111111110 0001111111111000 0000011111100000'),
};
const TYPES = [
  { a: 'watcherA', b: 'watcherB', color: '#00e5ff', pts: 30 },
  { a: 'botA',     b: 'botB',     color: '#ffe600', pts: 20 },
  { a: 'mothA',    b: 'mothB',    color: '#ff2bd6', pts: 10 },
];
const SHIP_W = 11 * PIXEL, SHIP_H = 8 * PIXEL;
const POWER = {
  rapid:  { label: 'RAPID',  letter: 'R', color: '#ffe600' },
  spread: { label: 'SPREAD', letter: 'S', color: '#ff2bd6' },
  shield: { label: 'SHIELD', letter: 'O', color: '#00e5ff' },
  life:   { label: '1UP',    letter: '+', color: '#39ff14' },
};

// HD pixel art: every sprite is refined to double resolution with the Scale2x (EPX) algorithm,
// which smooths diagonal edges, then pre-rendered once at the screen's real pixel density with
// top-light / bottom-shadow shading and a tight neon glow.
function scale2x(g) {
  const h = g.length, w = g[0].length, o = Array.from({ length: h * 2 }, () => new Array(w * 2).fill(0));
  const at = (r, c) => (r < 0 || c < 0 || r >= h || c >= w) ? 0 : g[r][c];
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const P = at(r, c), A = at(r - 1, c), B = at(r, c + 1), C = at(r, c - 1), D = at(r + 1, c);
    o[2 * r][2 * c]         = (C === A && C !== D && A !== B) ? A : P;
    o[2 * r][2 * c + 1]     = (A === B && A !== C && B !== D) ? B : P;
    o[2 * r + 1][2 * c]     = (D === C && D !== B && C !== A) ? C : P;
    o[2 * r + 1][2 * c + 1] = (B === D && B !== A && D !== C) ? D : P;
  }
  return o;
}
const HD = {};
for (const k in SPRITES) HD[k] = scale2x(SPRITES[k]);
const SH = PIXEL / 2;   // size of one HD cell in logical px

function rgbOf(hex) {
  const h = hex.length === 4 ? hex.slice(1).split('').map(x => x + x).join('') : hex.slice(1);
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
const mixRGB = (c, t, k) => 'rgb(' + c.map((v, i) => Math.round(v + (t[i] - v) * k)).join(',') + ')';
function shades(hex) {
  const c = rgbOf(hex);
  return { base: mixRGB(c, c, 0), light: mixRGB(c, [255, 255, 255], 0.45), dark: mixRGB(c, [0, 0, 0], 0.32) };
}
// Paint a 0/1 grid with shading into context g at offset (ox, oy), k device px per cell
function paintGrid(g, grid, ox, oy, k, sh) {
  const rows = grid.length, cols = grid[0].length;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (!grid[r][c]) continue;
    const up = r > 0 && grid[r - 1][c], down = r < rows - 1 && grid[r + 1][c], right = c < cols - 1 && grid[r][c + 1];
    g.fillStyle = !up ? sh.light : (!down || !right) ? sh.dark : sh.base;
    const x0 = Math.round(ox + c * k), y0 = Math.round(oy + r * k);
    g.fillRect(x0, y0, Math.round(ox + (c + 1) * k) - x0, Math.round(oy + (r + 1) * k) - y0);
  }
}

let W = 480, H = 800, renderScale = 1;
const GLOW = 5;
const cache = new Map();
function spriteCanvas(name, color, scale, glow) {
  const key = name + '|' + color + '|' + scale + '|' + glow;
  let c = cache.get(key);
  if (c) return c;
  const sp = HD[name], k = scale / 2 * renderScale, p = glow ? Math.ceil(GLOW * renderScale) : 0;
  c = document.createElement('canvas');
  c.width = Math.ceil(sp[0].length * k) + p * 2;
  c.height = Math.ceil(sp.length * k) + p * 2;
  const g = c.getContext('2d');
  if (glow) {
    // Soft glow pass underneath, then the crisp shaded pixels on top
    g.shadowColor = color; g.shadowBlur = 5 * renderScale; g.fillStyle = color;
    g.globalAlpha = 0.85;
    for (let r = 0; r < sp.length; r++) for (let q = 0; q < sp[r].length; q++)
      if (sp[r][q]) g.fillRect(p + Math.round(q * k), p + Math.round(r * k), Math.ceil(k), Math.ceil(k));
    g.shadowBlur = 0; g.globalAlpha = 1;
  }
  paintGrid(g, sp, p, p, k, shades(color));
  c.padL = p / renderScale;
  cache.set(key, c);
  return c;
}
function draw(name, x, y, color, scale = PIXEL, glow = true) {
  const c = spriteCanvas(name, color, scale, glow), rs = renderScale;
  ctx.drawImage(c, Math.round((x - c.padL) * rs) / rs, Math.round((y - c.padL) * rs) / rs, c.width / rs, c.height / rs);
}
function spriteURL(name, color, px) {
  const sp = HD[name], d = Math.min(window.devicePixelRatio || 1, 3), k = px / 2 * d, c = document.createElement('canvas');
  c.width = Math.ceil(sp[0].length * k); c.height = Math.ceil(sp.length * k);
  paintGrid(c.getContext('2d'), sp, 0, 0, k, shades(color));
  return { url: c.toDataURL(), w: sp[0].length * px / 2, h: sp.length * px / 2 };
}

// ---------- sound (synthesised, no files) ----------
const audio = {
  ac: null, out: null, nb: null, _u: 520,
  // 'all' = music + effects, 'sfx' = effects only, 'off'
  mode: (m => ['all', 'sfx', 'off'].includes(m) ? m : 'all')(store.get('audioMode', store.get('sound', true) ? 'all' : 'off')),
  get on() { return this.mode !== 'off'; },
  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ac = new AC(); } catch (e) { return; }
      this.out = this.ac.createGain(); this.out.gain.value = 0.22; this.out.connect(this.ac.destination);
      const len = Math.floor(this.ac.sampleRate * 0.7);
      this.nb = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ac.state !== 'running') this.ac.resume().catch(() => {});
  },
  ok() { return this.on && this.ac && this.ac.state === 'running'; },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;
    const { type = 'square', to = 0, vol = 0.5, at = 0 } = o;

// ---------- music: original chiptune song (verse / chorus / harmonised verse) ----------
// Bouncy swung lead and octave-hopping bass in the verse, a marching bass in the chorus,

const MEL_A = [

  [79, 0, 0, 83, 0, 79, 74, 0],
  [76, 79, 84, 0, 79, 76, 72, 0],
  [81, 0, 0, 76, 0, 72, 69, 0],
  [77, 0, 81, 0, 86, 0, 84, 81],
  [83, 0, 79, 0, 74, 0, 79, 83],
  [84, 0, 0, 0, 79, 0, 76, 79],
  [74, 0, 77, 79, 83, 0, 86, 0],

  { chords: ['Dm', 'G', 'C', 'Am', 'Dm', 'G', 'C', 'G'], mel: MEL_B, bass: 'march', arp: true, harm: false },

// ---------- modern space backdrop: slowly scrolling pixel-art nebulae and star glints ----------
const SECTORS = [
  { name: 'EARTH ORBIT',   neb: [[30, 60, 170], [120, 40, 170]], key: 0 },
  { name: 'THE MOON',      neb: [[20, 90, 130], [70, 40, 140]],  key: 2 },
  { name: 'MARS',          neb: [[170, 60, 40], [110, 30, 100]], key: -3 },
  { name: 'ASTEROID BELT', neb: [[110, 80, 60], [60, 40, 110]],  key: 5 },
  { name: 'JUPITER',       neb: [[200, 110, 50], [30, 120, 150]], key: 0 },
  { name: 'SATURN',        neb: [[190, 150, 70], [90, 50, 150]], key: 2 },
  { name: 'NEPTUNE',       neb: [[30, 90, 200], [20, 160, 170]], key: -2 },
  { name: 'DEEP NEBULA',   neb: [[230, 120, 60], [40, 150, 180]], key: 3, bright: true },

const sectorIdx = () => (level - 1) % SECTORS.length;

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

}

  const r = rng(seed), v = new Float32Array(256 * 256);
  for (let i = 0; i < v.length; i++) v[i] = r();
  const at = (x, y) => v[(y & 255) * 256 + (x & 255)];

  const n = (x, y) => {

    const a = at(ix, iy), b = at(ix + 1, iy), c = at(ix, iy + 1), d = at(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };

    let s = 0, amp = 0.5, f = 1, norm = 0;

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

// Soft, painterly nebula (smoothly scaled up behind the crisp sprites) that tiles seamlessly top-to-bottom
function makeNebula(sec, seed) {
  const cell = 6, w = Math.ceil(W * 1.1 / cell), h = Math.ceil(H / cell);
  const c = newCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  const f = noiseGen(seed), [ca, cb] = sec.neb, k = sec.bright ? 1.15 : 0.9;

  const field = (x, y) => {
    const nx = x * sc / 40, ny = y * sc / 40;
    const warp = f(nx * 0.7 + 10, ny * 0.7 + 3, 3);
    let v = clamp((f(nx + warp * 1.8, ny + warp * 1.8, 5) - 0.4) / 0.4, 0, 1);
    v *= 1 - clamp((f(nx * 2.2 + 40, ny * 2.2, 3) - 0.55) * 3, 0, 1) * 0.75;   // dark dust lanes
    return [v, f(nx * 0.5 + 77, ny * 0.5 + 9, 3)];

    const t = y / h;                                   // blend with the copy one tile up -> seamless wrap
    for (let x = 0; x < w; x++) {

      const v = A[0] * (1 - t) + B[0] * t, mRaw = A[1] * (1 - t) + B[1] * t;

let backdrop = null, meteors = [], scrollY = 0;
function ensureBackdrop() {
  const menu = state === 'menu' || state === 'scores' || !player;
  const idx = menu ? -1 : sectorIdx();
  const key = idx + '|' + W + '|' + H;
  if (backdrop && backdrop.key === key) return backdrop;
  const sec = menu ? { neb: [[40, 50, 160], [140, 40, 160]] } : SECTORS[idx];
  const seed = 1234 + (idx + 1) * 977, r = rng(seed + 5);

  for (let i = 0; i < 6; i++) b.spikes.push({ x: r() * W, y: r() * H, s: 5 + r() * 9, c: ['#ffffff', '#ffe9c4', '#cfe6ff'][i % 3], p: r() * 6 });

// Slow, endless forward travel: the nebula scrolls gently and wraps seamlessly
const NEBULA_SPEED = 7, GLINT_SPEED = 11;   // logical px per second
function drawSpace(dt) {
  const bd = ensureBackdrop();
  const par = !bd.menu && player ? (player.x + SHIP_W / 2 - W / 2) * -0.02 : 0;

    if (!reduceMotion) { st.y += GLINT_SPEED * dt; if (st.y > H + 20) { st.y = -20; st.x = rand(0, W); } }

    const m = meteors[i];

// ---------- layout: fill any screen (portrait, landscape, folded or unfolded) ----------
let bgGrad = null, hudGrad = null;
function layout() {
  const cs = getComputedStyle(app);
  const cw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ch = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (cw <= 0 || ch <= 0) return;
  const aspect = cw / ch;
  let nW, nH;
  // Tall phones use a narrower play field so sprites render larger
  if (aspect < 1) { nW = aspect < 0.6 ? 420 : 480; nH = Math.round(clamp(nW / aspect, 600, 1040)); }
  else { nH = 600; nW = Math.round(clamp(600 * aspect, 480, 1000)); }
  const scale = Math.min(cw / nW, ch / nH);
  const dispW = Math.floor(nW * scale), dispH = Math.floor(nH * scale);
  stage.style.width = dispW + 'px';
  stage.style.height = dispH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(dispW * dpr);
  canvas.height = Math.round(dispH * dpr);
  renderScale = canvas.width / nW;
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const oldW = W, oldH = H;
  W = nW; H = nH;
  cache.clear(); bgGrad = null;
  for (const sh of shields) sh.cv = null;
  initStars();
  onResize(oldW, oldH);
}

addEventListener('resize', queueLayout);
addEventListener('orientationchange', () => setTimeout(layout, 250));

function initAliens() {
  aliens = [];
  const cols = clamp(Math.floor((W - 120) / 42), 7, 12), rows = 5, gapX = 42, gapY = 34, cell = 33;
  const formW = (cols - 1) * gapX + cell;
  const x0 = (W - formW) / 2, y0 = 96 + Math.max(0, (H - 700) * 0.2) + Math.min(level - 1, 6) * 14;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const type = r === 0 ? 0 : r < 3 ? 1 : 2, sp = SPRITES[TYPES[type].a];
      const w = sp[0].length * PIXEL, h = sp.length * PIXEL;
      aliens.push({ x: x0 + c * gapX + (cell - w) / 2, y: y0 + r * gapY, w, h, type, col: c, alive: true });
    }
  }
  total = aliveN = aliens.length;
  animFrame = 0; animT = 0;
}

function initShields() {
  const n = W >= 760 ? 5 : 4;
  shields = [];
  for (let i = 0; i < n; i++) shields.push({ grid: HD.barrier.map(r => r.slice()), x: 0, y: 0, w: 16 * PIXEL, h: 8 * PIXEL, cv: null });
  placeShields();
}
function placeShields() {
  const n = shields.length, sp = W / n;
  shields.forEach((s, i) => { s.x = Math.round(sp * (i + 0.5) - s.w / 2); s.y = shieldY(); });
}

function onResize(oldW, oldH) {
  if (!player) return;
  const oldPY = oldH - 40 - 12 - SHIP_H;
  player.y = playerY();
  player.x = clamp(player.x + (W - oldW) / 2, 8, W - 8 - SHIP_W);
  player.tx = player.x;
  if (aliens.length) {
    let minX = Infinity, maxX = -Infinity;
    for (const a of aliens) { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); }
    const fw = maxX - minX, avail = W - 24, k = fw > avail ? avail / fw : 1, nx0 = (W - fw * k) / 2;
    // Move the whole formation (keeping row spacing) so it sits the same way relative to the new screen height
    let minY = Infinity, maxY = -Infinity;
    for (const a of aliens) if (a.alive) { minY = Math.min(minY, a.y); maxY = Math.max(maxY, a.y + a.h); }
    let dy = 0;
    if (minY < Infinity) {
      const ky = (playerY() - 90) / Math.max(1, oldPY - 90);
      dy = (90 + (minY - 90) * ky) - minY;
      const limit = shieldY() - 10;
      if (maxY + dy > limit) dy = limit - maxY;
      if (minY + dy < 80) dy = 80 - minY;
    }
    for (const a of aliens) { a.x = nx0 + (a.x - minX) * k; a.y += dy; }
  }
  placeShields();
  pBullets.length = 0; aBullets.length = 0;
  for (const d of drops) d.x = clamp(d.x, 0, W - d.w);
}

// ---------- gameplay ----------
function fire() {
  const rapid = powers.rapid > 0, spread = powers.spread > 0;
  const maxB = (rapid ? 8 : 3) * (spread ? 3 : 1);
  if (shootCD > 0 || pBullets.length >= maxB) return;
  const cx = player.x + SHIP_W / 2 - 1.5, y = player.y - 10;
  if (spread) for (const dx of [-140, 0, 140]) pBullets.push({ x: cx, y, dx, dy: -520 });
  else pBullets.push({ x: cx, y, dx: 0, dy: -560 });
  shootCD = rapid ? (spread ? 0.16 : 0.1) : (spread ? 0.32 : 0.3);
  audio.shoot();
}

function update(dt) {
  if (bannerT > 0) bannerT -= dt;
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) store.set('tut', true); }
  shootCD -= dt;
  powers.rapid = Math.max(0, powers.rapid - dt);
  powers.spread = Math.max(0, powers.spread - dt);
  ease = Math.max(0, ease - dt);
  if (bannerT <= 0) waveT += dt;
  // Combo drains over time instead of resetting on a missed shot
  if (combo > 0 && (comboT -= dt) <= 0) combo = 0;
  // Extra life every LIFE_EVERY points
  if (score >= nextLife) {
    nextLife += LIFE_EVERY;
    if (lives < 5) { lives++; text(W / 2, shieldY() - 40, 'EXTRA LIFE!', '#39ff14', 14); audio.oneUp(); buzz(40); }
  }
  bombBtn.classList.toggle('ready', bomb >= 1);

  // Player
  if (player.alive) {
    const dir = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    if (dir) player.tx = player.x + dir * 330 * dt;
    player.tx = clamp(player.tx, 8, W - 8 - SHIP_W);
    if (dir) player.x = player.tx;
    else player.x += (player.tx - player.x) * Math.min(1, dt * 22);
    if (player.inv > 0) player.inv -= dt;
    if (isFiring() || keys[' ']) fire();
  } else if (lives > 0) {
    respawnT -= dt;
    if (respawnT <= 0) { player.alive = true; player.inv = 2; aBullets.length = 0; }
  } else {
    overT -= dt;
    if (overT <= 0) { gameOver(); return; }
  }

  // Bullets
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    b.x += b.dx * dt; b.y += b.dy * dt;
    if (b.y < 28 || b.x < -10 || b.x > W + 10) pBullets.splice(i, 1);
  }
  const abv = Math.min(420, 200 + level * 18) * (ease > 0 ? 0.8 : 1);
  for (let i = aBullets.length - 1; i >= 0; i--) {
    const b = aBullets[i];
    b.y += abv * dt; b.t += dt;
    if (b.y + 18 > groundY()) { sparks(b.x + 4, groundY(), '#ff3355', 4); aBullets.splice(i, 1); }
  }

  // Enemies
  if (bannerT <= 0) { moveAliens(dt); alienShoot(dt); spawnUfo(dt); }
  // Aimed shots flash red first, then fire
  for (const a of aliens) {
    if (a.warn > 0 && (a.warn -= dt) <= 0 && a.alive && player.alive)
      aBullets.push({ x: a.x + a.w / 2 - 4.5, y: a.y + a.h, t: 0 });
  }
  animT += dt;
  if (animT > Math.max(0.12, 0.55 - (1 - aliveN / total) * 0.4)) { animT = 0; animFrame ^= 1; }
  if (ufo) {
    ufo.x += ufo.dx * dt; ufo.snd -= dt;
    if (ufo.snd <= 0) { audio.ufo(); ufo.snd = 0.18; }
    if (ufo.x < -70 || ufo.x > W + 70) ufo = null;
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    drops[i].y += 95 * dt; drops[i].t += dt;
    if (drops[i].y > groundY()) drops.splice(i, 1);
  }

  collisions();

  if (aliveN === 0 && state === 'play') {
    const bonus = 200 * level;
    score += bonus; bumpBest();
    text(W / 2, shieldY() - 30, 'WAVE CLEAR +' + bonus, '#39ff14', 12);
    level++;
    startWave();
  }
}

function moveAliens(dt) {
  if (!aliveN) return;
  const killed = total - aliveN;
  const sp = Math.min(380, (52 + (level - 1) * 9) * (1 + 2.6 * Math.pow(killed / total, 1.7)));
  const dx = alienDir * sp * dt;
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  for (const a of aliens) if (a.alive) { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); maxY = Math.max(maxY, a.y + a.h); }
  if ((alienDir > 0 && maxX + dx > W - 10) || (alienDir < 0 && minX + dx < 10)) {
    alienDir *= -1;
    for (const a of aliens) a.y += 14;
    maxY += 14;
  } else {
    for (const a of aliens) a.x += dx;
  }
  if (maxY >= player.y && lives > 0) invasion();
}

// Fire rate starts gentle at the beginning of each wave, then builds; eases off for a while after repeated deaths
function pressure() { return (ease > 0 ? 0.6 : 1) * Math.min(1, 0.55 + waveT / 15); }

function alienShoot(dt) {
  const maxB = Math.max(1, Math.min(6, 2 + Math.floor(level / 2)) - (ease > 0 ? 1 : 0));
  if (aBullets.length >= maxB || Math.random() > (0.9 + level * 0.25) * pressure() * dt) return;
  const bottoms = {};
  for (const a of aliens) if (a.alive && (!bottoms[a.col] || a.y > bottoms[a.col].y)) bottoms[a.col] = a;
  const list = Object.values(bottoms);
  if (!list.length) return;
  if (Math.random() < 0.4) {
    // Aimed shot: telegraphed with a short red flash so it can be dodged
    const px = player.x + SHIP_W / 2;
    const s = list.reduce((m, a) => Math.abs(a.x + a.w / 2 - px) < Math.abs(m.x + m.w / 2 - px) ? a : m);
    if (!(s.warn > 0)) s.warn = 0.4;
    return;
  }
  const s = list[Math.floor(Math.random() * list.length)];
  aBullets.push({ x: s.x + s.w / 2 - 4.5, y: s.y + s.h, t: 0 });
}

function spawnUfo(dt) {
  if (ufo || Math.random() > dt / 13) return;
  const dir = Math.random() < 0.5 ? 1 : -1;
  ufo = { x: dir > 0 ? -50 : W + 2, y: 62, w: 48, h: 18, dx: dir * (105 + level * 8), pts: [100, 150, 200, 300][Math.floor(Math.random() * 4)], snd: 0 };
}

function collisions() {
  outer:
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i], br = { x: b.x, y: b.y, w: 3, h: 12 };
    for (const a of aliens) {
      if (a.alive && hit(br, a)) { killAlien(a); pBullets.splice(i, 1); continue outer; }
    }
    if (ufo && hit(br, ufo)) { killUfo(); pBullets.splice(i, 1); continue; }
    if (damageShield(br)) pBullets.splice(i, 1);
  }
  // Only the ship's glowing core can be hit; bullets that pass close by "graze" for bonus points
  const core = { x: player.x + SHIP_W / 2 - 5, y: player.y + 8, w: 10, h: 12 };
  const zone = { x: player.x - 12, y: player.y - 14, w: SHIP_W + 24, h: SHIP_H + 22 };
  for (let i = aBullets.length - 1; i >= 0; i--) {
    const b = aBullets[i], br = { x: b.x + 2, y: b.y + 2, w: 5, h: 14 };
    if (damageShield({ x: b.x, y: b.y, w: 9, h: 18 })) { aBullets.splice(i, 1); continue; }
    if (!player.alive) continue;
    if (player.inv <= 0 && hit(br, core)) { aBullets.splice(i, 1); playerHit(); continue; }
    if (!b.grazed && hit(br, zone)) {
      b.grazed = true;
      score += 10 * mult(); bumpBest();
      bomb = Math.min(1, bomb + 0.02);
      sparks(b.x + 4, b.y + 9, '#ffffff', 4, 80);
      text(b.x + 4, b.y, 'GRAZE', '#e8f7ff', 7);
      audio.graze();
    }
  }
  const sy = shieldY();
  for (const a of aliens) {
    if (!a.alive || a.y + a.h < sy) continue;
    for (const s of shields) if (hit(a, s)) eraseShield(s, a);
  }
  if (player.alive) {
    const pr = { x: player.x - 6, y: player.y - 6, w: SHIP_W + 12, h: SHIP_H + 12 };
    for (let i = drops.length - 1; i >= 0; i--) if (hit(drops[i], pr)) { collect(drops[i]); drops.splice(i, 1); }
  }
}

function damageShield(br) {
  for (const s of shields) {
    if (!hit(br, s)) continue;
    const cols = s.grid[0].length, rows = s.grid.length;
    const c0 = Math.max(0, Math.floor((br.x - s.x) / SH)), c1 = Math.min(cols - 1, Math.floor((br.x + br.w - 0.01 - s.x) / SH));
    const r0 = Math.max(0, Math.floor((br.y - s.y) / SH)), r1 = Math.min(rows - 1, Math.floor((br.y + br.h - 0.01 - s.y) / SH));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (!s.grid[r][c]) continue;
        // Ragged crater, same physical size as before but with twice the detail
        for (let dr = -4; dr <= 4; dr++) for (let dc = -4; dc <= 4; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || cc < 0 || rr >= rows || cc >= cols) continue;
          const d = dr * dr + dc * dc;
          if (d <= 2 || (d <= 16 && Math.random() < 0.7 - d * 0.02)) s.grid[rr][cc] = 0;
        }
        s.cv = null;
        sparks(s.x + c * SH, s.y + r * SH, '#39ff14', 4);
        return true;
      }
    }
  }
  return false;
}

function eraseShield(s, a) {
  for (let r = 0; r < s.grid.length; r++) for (let c = 0; c < s.grid[r].length; c++) {
    const px = s.x + c * SH, py = s.y + r * SH;
    if (px < a.x + a.w && px + SH > a.x && py < a.y + a.h && py + SH > a.y && s.grid[r][c]) { s.grid[r][c] = 0; s.cv = null; }
  }
}

function drawShield(s) {
  const rs = renderScale;
  if (!s.cv) {
    s.cv = document.createElement('canvas');
    s.cv.width = Math.ceil(s.w * rs); s.cv.height = Math.ceil(s.h * rs);
    paintGrid(s.cv.getContext('2d'), s.grid, 0, 0, SH * rs, shades('#39ff14'));
  }
  ctx.drawImage(s.cv, Math.round(s.x * rs) / rs, Math.round(s.y * rs) / rs, s.cv.width / rs, s.cv.height / rs);
}

function killAlien(a, byBomb) {
  a.alive = false; a.warn = 0; aliveN--; combo++; comboT = COMBO_TIME;
  const m = mult(), t = TYPES[a.type];
  score += t.pts * m; bumpBest();
  boom(a.x + a.w / 2, a.y + a.h / 2, t.color, 1);
  if (!byBomb) audio.kill();
  if (m > 1 && combo % 8 === 0) text(a.x + a.w / 2, a.y, 'x' + m + ' COMBO', '#ff2bd6', 10);
  if (Math.random() < 0.035) drop(a.x + a.w / 2, a.y);
  if (!byBomb && bomb < 1) {
    bomb = Math.min(1, bomb + BOMB_PER_KILL);
    if (bomb >= 1) bombReady();
  }
}

function bombReady() {
  audio.ready();
  text(W / 2, shieldY() - 40, 'BOMB READY!', '#ff2bd6', 12);
  if (!store.get('bombTip', false)) {
    text(W / 2, shieldY() - 22, finePointer ? 'PRESS B' : 'TAP THE BOMB BUTTON', '#ff2bd6', 8);
    store.set('bombTip', true);
  }
}

// Smart bomb: wipes every enemy bullet and blasts the front row of the formation
function useBomb() {
  if (state !== 'play' || bomb < 1 || !player || !player.alive) return;
  bomb = 0;
  for (const b of aBullets) sparks(b.x + 4, b.y + 9, '#ff3355', 3);
  aBullets.length = 0;
  const front = {};
  for (const a of aliens) { a.warn = 0; if (a.alive && (!front[a.col] || a.y > front[a.col].y)) front[a.col] = a; }
  for (const a of Object.values(front)) killAlien(a, true);
  if (ufo) killUfo();
  player.inv = Math.max(player.inv, 1);
  flashT = 0.35; flashCol = '255,255,255'; shakeT = 0.4;
  text(W / 2, H * 0.45, 'SMART BOMB!', '#ffffff', 16);
  audio.bomb(); buzz([30, 30, 90]);
  bombBtn.classList.remove('ready');
}

function killUfo() {
  score += ufo.pts; bumpBest();
  boom(ufo.x + ufo.w / 2, ufo.y + ufo.h / 2, '#ff2bd6', 1.6);
  text(ufo.x + ufo.w / 2, ufo.y, '+' + ufo.pts, '#ffe600', 12);
  drop(ufo.x + ufo.w / 2, ufo.y + ufo.h);
  audio.bonus(); buzz(25);
  ufo = null;
}

function drop(x, y) {
  const r = Math.random(), type = r < 0.35 ? 'rapid' : r < 0.65 ? 'spread' : r < 0.9 ? 'shield' : 'life';
  drops.push({ x: x - 10, y, w: 20, h: 20, type, t: 0 });
}

function collect(d) {
  const p = POWER[d.type];
  if (d.type === 'life') {
    if (lives < 5) lives++; else { score += 500; bumpBest(); }
  } else if (d.type === 'shield') player.shield = true;
  else powers[d.type] = 9;
  text(player.x + SHIP_W / 2, player.y - 16, p.label + '!', p.color, 12);
  audio.power(); buzz(30);
}

// A hit costs the shield first, then your power-ups, and only then a life
function playerHit() {
  const cx = player.x + SHIP_W / 2, cy = player.y + SHIP_H / 2;
  if (player.shield) {
    player.shield = false; player.inv = 1.2; shakeT = 0.2;
    sparks(cx, cy, '#00e5ff', 26, 200);
    text(cx, player.y - 16, 'SHIELD DOWN', '#00e5ff', 9);
    audio.shieldPop(); buzz(40);
    return;
  }
  if (powers.rapid > 0 || powers.spread > 0) {
    powers.rapid = powers.spread = 0; player.inv = 1.2; shakeT = 0.25;
    sparks(cx, cy, '#ffe600', 20, 180);
    text(cx, player.y - 16, 'POWER LOST', '#ffe600', 9);
    audio.powerDown(); buzz(50);
    return;
  }
  loseLife();
}

function loseLife() {
  player.alive = false; player.shield = false; lives = Math.max(0, lives - 1);
  combo = 0; powers.rapid = powers.spread = 0;
  for (const a of aliens) a.warn = 0;
  boom(player.x + SHIP_W / 2, player.y + SHIP_H / 2, '#39ff14', 2.2);
  shakeT = 0.45; flashT = 0.25; flashCol = '255,51,85';
  audio.die(); buzz([60, 40, 120]);
  // Two deaths close together: quietly ease off for 30 seconds
  deaths.push(time);
  deaths = deaths.filter(t => time - t < 45);
  if (deaths.length >= 2) { ease = 30; deaths = []; }
  if (lives > 0) respawnT = 1.4; else overT = 1.3;
}

// Enemies reached the bottom: costs one life and the formation is pushed back to the top
function invasion() {
  let minY = Infinity;
  for (const a of aliens) if (a.alive) minY = Math.min(minY, a.y);
  const dy = Math.max(0, minY - 96);
  for (const a of aliens) { a.y -= dy; a.warn = 0; }
  aBullets.length = 0;
  text(W / 2, shieldY() - 40, 'THEY BROKE THROUGH!', '#ff3355', 11);
  initShields();
  if (player.alive) loseLife();
  else { lives = Math.max(0, lives - 1); if (!lives) overT = 1.3; }
}

function bumpBest() { if (score > best) best = score; }

// ---------- effects ----------
function boom(x, y, color, size) {
  booms.push({ x, y, color, t: 0, size });
  sparks(x, y, color, Math.round(14 * size), 220 * size);
}
function sparks(x, y, color, n, v = 160) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, Math.PI * 2), sp = rand(30, v), life = rand(0.35, 0.9);
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life, max: life, color, s: rand(1.5, 3.5) });
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}
function text(x, y, str, color, size) { texts.push({ x, y, str, color, size, life: 1.2 }); }

function updateFx(dt) {
  if (shakeT > 0) shakeT -= dt;
  if (flashT > 0) flashT -= dt;
  for (let i = booms.length - 1; i >= 0; i--) if ((booms[i].t += dt) > 0.32) booms.splice(i, 1);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; p.vx *= 0.98;
    if ((p.life -= dt) <= 0) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.y -= 26 * dt;
    if ((t.life -= dt) <= 0) texts.splice(i, 1);
  }
}

// ---------- rendering ----------
function drawBackground(dt) {
  ctx.fillStyle = '#04010c';
  ctx.fillRect(0, 0, W, H);
  for (const st of stars) {
    st.y += (5 + st.z * 26) * dt;
    if (st.y > H) { st.y = 0; st.x = rand(0, W); }
    ctx.globalAlpha = clamp(0.25 + st.z * 0.6 + Math.sin(time * 3 + st.x) * 0.15, 0, 1);
    ctx.fillStyle = st.z > 0.85 ? '#9ff' : '#fff';
    const sz = st.z > 0.7 ? 2 : 1;
    ctx.fillRect(st.x, st.y, sz, sz);
  }
  ctx.globalAlpha = 1;
  drawSpace(dt);
}

function glowText(str, x, y, color, size, align = 'center') {
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

function drawWorld() {
  // Barriers
  for (const s of shields) drawShield(s);

  // Invaders
  for (const a of aliens) {
    if (!a.alive) continue;
    const t = TYPES[a.type];
    const color = a.warn > 0 ? (Math.floor(a.warn * 20) % 2 ? '#ffffff' : '#ff3355') : t.color;
    draw(animFrame ? t.b : t.a, a.x, a.y, color);
  }
  if (ufo) draw('carrier', ufo.x, ufo.y, '#ff2bd6');

  // Power-up capsules
  ctx.textBaseline = 'middle';
  for (const d of drops) {
    const p = POWER[d.type], pulse = 0.6 + Math.sin(d.t * 10) * 0.4;
    ctx.strokeStyle = p.color; ctx.lineWidth = 2;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10 * pulse;
    ctx.strokeRect(d.x + 1, d.y + 1, d.w - 2, d.h - 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = p.color; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(p.letter, d.x + d.w / 2 + 0.5, d.y + d.h / 2 + 1);
  }

  // Bullets
  ctx.globalCompositeOperation = 'lighter';
  for (const b of pBullets) {
    draw('laser', b.x, b.y, '#55eeff');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x + 0.75, b.y + 1, 1.5, 10);    // white-hot core
  }
  for (const b of aBullets) draw(Math.floor(b.t * 8) % 2 ? 'boltA' : 'boltB', b.x, b.y, '#ff3355');
  ctx.globalCompositeOperation = 'source-over';

  // Player
  if (player && player.alive && !(player.inv > 0 && Math.floor(player.inv * 12) % 2)) {
    // Engine plume: flickering additive glow
    const fx = player.x + SHIP_W / 2, fy = player.y + SHIP_H;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,140,0,.55)'; ctx.fillRect(fx - 2.25, fy, 4.5, 3 + Math.random() * 5);
    ctx.fillStyle = 'rgba(255,240,150,.9)'; ctx.fillRect(fx - 0.75, fy, 1.5, 2 + Math.random() * 4);
    ctx.globalCompositeOperation = 'source-over';
    draw('ship', player.x, player.y, '#39ff14');
    // Glowing core = the only part that can be hit
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 6;
    ctx.fillRect(player.x + SHIP_W / 2 - 2, player.y + 13, 4, 4);
    ctx.shadowBlur = 0;
  }
  if (player && player.alive && player.shield) {
    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.55 + Math.sin(time * 6) * 0.25;
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(player.x + SHIP_W / 2, player.y + SHIP_H / 2, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // Explosions and particles (additive, so overlapping light blooms brighter)
  ctx.globalCompositeOperation = 'lighter';
  for (const b of booms) {
    ctx.globalAlpha = 1 - b.t / 0.32;
    const sc = PIXEL * b.size;
    draw('burst', b.x - 5.5 * sc, b.y - 3.5 * sc, b.color, sc);
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life * 1.5, 0, 1);
    glowText(t.str, t.x, t.y, t.color, t.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  if (!hudGrad || hudGrad.h !== H) {
    hudGrad = { h: H, top: ctx.createLinearGradient(0, 0, 0, 70), bot: ctx.createLinearGradient(0, H - 46, 0, H) };
    hudGrad.top.addColorStop(0, 'rgba(4,1,12,.85)'); hudGrad.top.addColorStop(1, 'rgba(4,1,12,0)');
    hudGrad.bot.addColorStop(0, 'rgba(4,1,12,.4)'); hudGrad.bot.addColorStop(1, 'rgba(4,1,12,.9)');
  }
  ctx.fillStyle = hudGrad.top; ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = hudGrad.bot; ctx.fillRect(0, H - 46, W, 46);
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = '8px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('SCORE', 12, 12);
  ctx.font = '14px ' + FONT; ctx.fillStyle = '#e8f7ff';
  ctx.fillText(pad(score), 12, 26);
  const m = mult();
  if (m > 1) {
    ctx.font = '10px ' + FONT; ctx.fillStyle = '#ff2bd6'; ctx.fillText('x' + m, 104, 28);
    ctx.fillRect(104, 41, 24 * clamp(comboT / COMBO_TIME, 0, 1), 2);   // combo timer
  }
  // Smart bomb meter
  ctx.font = '7px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('BOMB', 12, 48);
  ctx.strokeStyle = 'rgba(255,43,214,.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(46.5, 47.5, 60, 6);
  const full = bomb >= 1;
  ctx.fillStyle = full && Math.floor(time * 6) % 2 ? '#ffffff' : '#ff2bd6';
  ctx.fillRect(48, 49, 57 * bomb, 3);
  ctx.textAlign = 'center';
  ctx.font = '8px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('BEST', W / 2 + 24, 12);
  ctx.font = '14px ' + FONT; ctx.fillStyle = '#ffe600';
  ctx.fillText(pad(best), W / 2 + 24, 26);
  ctx.font = '7px ' + FONT; ctx.fillStyle = 'rgba(0,229,255,.75)';
  ctx.fillText(SECTORS[sectorIdx()].name, W / 2 + 24, 46);

  // Ground, lives, wave, power timers
  const gy = groundY();
  ctx.fillStyle = 'rgba(57,255,20,.18)';
  ctx.fillRect(0, gy - 3, W, 8);
  ctx.fillStyle = '#39ff14';
  ctx.fillRect(0, gy, W, 2);
  for (let i = 0; i < lives; i++) draw('ship', 12 + i * 28, gy + 12, '#39ff14', 2, false);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = '8px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('WAVE ' + level, W - 12, gy + 20);
  let px = W / 2 - 40;
  for (const k of ['rapid', 'spread']) {
    if (powers[k] <= 0) continue;
    const p = POWER[k];
    ctx.fillStyle = p.color; ctx.textAlign = 'left'; ctx.font = '7px ' + FONT;
    ctx.fillText(p.letter, px, gy + 20);
    ctx.globalAlpha = powers[k] < 2 && Math.floor(time * 8) % 2 ? 0.3 : 1;
    ctx.fillRect(px + 10, gy + 17, 26 * (powers[k] / 9), 5);
    ctx.globalAlpha = 1;
    px += 44;
  }
}

function drawBanner() {
  if (bannerT <= 0) return;
  ctx.globalAlpha = Math.min(1, bannerT * 3);
  ctx.textBaseline = 'middle';
  const y = shieldY() - 128;
  glowText('WAVE ' + level, W / 2, y, '#00e5ff', 22);
  glowText(SECTORS[sectorIdx()].name, W / 2, y + 30, '#ff2bd6', 12);
  if (Math.floor(time * 4) % 2 === 0) glowText('GET READY', W / 2, y + 54, '#ffe600', 9);
  ctx.globalAlpha = 1;
}

function hintFinger(x, y, rgb, s = 1) {
  ctx.strokeStyle = 'rgba(' + rgb + ',.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 11 * s, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(' + rgb + ',.25)';
  ctx.beginPath(); ctx.arc(x, y, 7 * s, 0, Math.PI * 2); ctx.fill();
}

// Two-thumb mode: faint split line, side labels, and a ring under each active thumb
function drawTouchZones() {
  if (controls !== 'two' || finePointer || !player) return;
  const top = shieldY() + 40, gy = groundY();
  ctx.strokeStyle = 'rgba(232,247,255,.10)'; ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(W / 2 + 0.5, top); ctx.lineTo(W / 2 + 0.5, gy - 4); ctx.stroke();
  ctx.setLineDash([]);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.font = '7px ' + FONT;
  ctx.fillStyle = pointer.moveId !== null ? 'rgba(232,247,255,.5)' : 'rgba(232,247,255,.18)';
  ctx.fillText('< MOVE >', W * 0.25, gy - 10);
  ctx.fillStyle = pointer.fireIds.size ? 'rgba(255,51,85,.7)' : 'rgba(255,51,85,.25)';
  ctx.fillText('FIRE', W * 0.75, gy - 10);
  for (const t of pointer.touches.values()) {
    const rgb = t.kind === 'fire' ? '255,51,85' : '232,247,255';
    ctx.globalAlpha = 0.5;
    hintFinger(t.x, t.y, rgb, t.kind === 'fire' ? 1.6 + Math.sin(time * 20) * 0.15 : 1.6);
    ctx.globalAlpha = 1;
  }
}

function drawHint() {
  if (hintT <= 0 || !player) return;
  ctx.globalAlpha = Math.min(1, hintT);
  ctx.textBaseline = 'middle';
  const y = shieldY() - 22;
  if (finePointer) {
    glowText('ARROWS OR A/D TO MOVE', W / 2, y, '#e8f7ff', 9);
    glowText('SPACE TO FIRE', W / 2, y + 16, '#e8f7ff', 9);
  } else if (controls === 'two') {
    glowText('LEFT THUMB: DRAG TO MOVE', W / 2, y, '#e8f7ff', 8);
    glowText('RIGHT THUMB: HOLD TO FIRE', W / 2, y + 16, '#ff3355', 8);
    const fy = playerY() + SHIP_H / 2;
    hintFinger(W * 0.25 + Math.sin(time * 2.4) * 40, fy, '232,247,255');
    hintFinger(W * 0.75, fy, '255,51,85', 1 + Math.abs(Math.sin(time * 4)) * 0.4);
    glowText('<', W * 0.25 - 64, fy, '#e8f7ff', 10);
    glowText('>', W * 0.25 + 64, fy, '#e8f7ff', 10);
  } else {
    glowText('DRAG ANYWHERE TO MOVE', W / 2, y, '#e8f7ff', 9);
    glowText('HOLD TO FIRE', W / 2, y + 16, '#e8f7ff', 9);
    const fy = playerY() + SHIP_H + 4;
    hintFinger(W / 2 + Math.sin(time * 2.4) * 70, fy, '232,247,255');
    glowText('<', W / 2 - 100, fy, '#e8f7ff', 10);
    glowText('>', W / 2 + 100, fy, '#e8f7ff', 10);
  }
  ctx.globalAlpha = 1;
}

function render(dt) {
  drawBackground(state === 'paused' ? 0 : dt);
  if (state === 'menu' || state === 'scores' || !player) return;
  ctx.save();
  if (shakeT > 0 && !reduceMotion) { const m = shakeT * 14; ctx.translate(rand(-m, m), rand(-m, m)); }
  drawWorld();
  ctx.restore();
  drawHUD();
  drawBanner();
  drawTouchZones();
  drawHint();
  if (flashT > 0) { ctx.fillStyle = 'rgba(' + flashCol + ',' + Math.min(0.6, flashT * 1.2) + ')'; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (state !== 'paused') time += dt;
  if (state === 'play') { update(dt); updateFx(dt); }
  else if (state === 'over') updateFx(dt);
  render(dt);
  syncMusic();
  requestAnimationFrame(frame);
}

// ---------- screens ----------
const screens = ['menu', 'pause', 'over', 'scores'];
function showScreen(id) { for (const s of screens) $(s).classList.toggle('show', s === id); }
function setState(s) { state = s; document.body.dataset.state = s; }
function releaseInput() { pointer.moveId = null; pointer.fireIds.clear(); pointer.touches.clear(); keys = {}; }

function toMenu() {
  setState('menu'); releaseInput(); stopCont();
  $('bestVal').textContent = best;
  showScreen('menu');
}
function startGame() {
  audio.unlock();
  releaseInput(); stopCont();
  newGame();
  setState('play');
  showScreen(null);
}
function pauseGame() {
  if (state !== 'play') return;
  setState('paused'); releaseInput();
  showScreen('pause');
}
function resumeGame() {
  if (state !== 'paused') return;
  setState('play');
  showScreen(null);
  last = performance.now();
}
function gameOver() {
  setState('over'); releaseInput();
  store.set('best', best);
  audio.over();
  $('finalScore').textContent = score;
  $('newBest').classList.toggle('show', score > bestAtStart && score > 0);
  $('waveReached').textContent = 'REACHED WAVE ' + level;
  const list = getScores();
  const qualifies = score > 0 && (list.length < 10 || score > list[list.length - 1].s);
  $('saveForm').classList.toggle('show', qualifies);
  $('nameInput').value = store.get('name', '');
  $('savedMsg').textContent = '';
  const over = $('over');
  over.classList.add('locked');          // stop a finger still on the screen from tapping PLAY AGAIN
  setTimeout(() => over.classList.remove('locked'), 800);
  startContCountdown();
  showScreen('over');
}

function getScores() {
  const v = store.get('scores', []);
  return Array.isArray(v) ? v.filter(x => x && typeof x.s === 'number').slice(0, 10) : [];
}
let lastSaved = null;
function saveScore(e) {
  e.preventDefault();
  const input = $('nameInput');
  const name = (input.value || '').toUpperCase().replace(/[^A-Z0-9 ._-]/g, '').trim().slice(0, 8) || 'PLAYER';
  store.set('name', name);
  const entry = { n: name, s: score, w: level, id: Date.now() };
  const list = getScores();
  list.push(entry);
  list.sort((a, b) => b.s - a.s);
  const top = list.slice(0, 10);
  store.set('scores', top);
  lastSaved = entry.id;
  input.blur();
  window.scrollTo(0, 0);
  $('saveForm').classList.remove('show');
  $('savedMsg').textContent = 'SAVED - RANK #' + (top.findIndex(x => x.id === entry.id) + 1);
  audio.power();
}
function showScores() {
  setState('scores');
  const ol = $('scoreList');
  ol.textContent = '';
  const list = getScores();
  if (!list.length) {
    const li = document.createElement('li');
    li.textContent = 'NO SCORES YET';
    ol.appendChild(li);
  }
  list.forEach((s, i) => {
    const li = document.createElement('li');
    if (s.id === lastSaved) li.className = 'me';
    for (const t of [(i + 1) + '.', s.n, String(s.s)]) {
      const span = document.createElement('span');
      span.textContent = t;
      li.appendChild(span);
    }
    ol.appendChild(li);
  });
  showScreen('scores');
}
function toggleSound() {
  audio.mode = { all: 'sfx', sfx: 'off', off: 'all' }[audio.mode];
  store.set('audioMode', audio.mode);
  syncSound();
  audio.click();
}
function syncSound() {
  const label = { all: 'MUSIC + SFX', sfx: 'SFX ONLY', off: 'SOUND OFF' }[audio.mode];
  for (const id of ['soundBtn', 'soundBtn2']) $(id).textContent = label;
}
function toggleControls() {
  controls = controls === 'two' ? 'one' : 'two';
  store.set('controls', controls);
  releaseInput();
  syncControls();
}
function syncControls() {
  for (const id of ['ctrlBtn', 'ctrlBtn2']) $(id).textContent = controls === 'two' ? '2 THUMBS' : '1 THUMB';
  $('howto').innerHTML = controls === 'two'
    ? 'LEFT THUMB: DRAG TO MOVE<br>RIGHT THUMB: HOLD TO FIRE'
    : 'DRAG ANYWHERE TO MOVE<br>HOLD TO FIRE';
}

// Continue: keep the wave you reached, but the score starts again from 0
let contTimer = null;
function stopCont() { if (contTimer) { clearInterval(contTimer); contTimer = null; } }
function startContCountdown() {
  stopCont();
  let sec = 9;
  $('contWave').textContent = level;
  $('contSec').textContent = sec;
  $('contBtn').hidden = false; $('contNote').hidden = false;
  contTimer = setInterval(() => {
    if (document.activeElement === $('nameInput') || state !== 'over') return;   // don't run out while typing a name
    sec--;
    $('contSec').textContent = sec;
    if (sec <= 0) { stopCont(); $('contBtn').hidden = true; $('contNote').hidden = true; }
  }, 1000);
}
function continueGame() {
  if (state !== 'over') return;
  stopCont(); releaseInput();
  resetRun();
  bomb = 0.5; ease = 30;          // a little help to get back on your feet
  player.inv = 2;
  startWave();
  setState('play');
  showScreen(null);
}

const on = (id, fn) => $(id).addEventListener('click', e => { audio.unlock(); e.currentTarget.blur(); audio.click(); fn(); });
on('playBtn', startGame);
on('scoresBtn', showScores);
on('soundBtn', toggleSound);
on('soundBtn2', toggleSound);
on('resumeBtn', resumeGame);
on('quitBtn', toMenu);
on('againBtn', startGame);
on('menuBtn', toMenu);
on('backBtn', toMenu);
on('pauseBtn', pauseGame);
on('ctrlBtn', toggleControls);
on('ctrlBtn2', toggleControls);
on('contBtn', continueGame);
bombBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audio.unlock(); useBomb(); });
$('saveForm').addEventListener('submit', saveScore);
$('nameInput').addEventListener('blur', () => window.scrollTo(0, 0));

// ---------- input ----------
function logicalX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
function logicalY(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientY - r.top) / r.height * H;
}
// Two thumbs (default): a touch that starts on the left half steers, a touch on the right half fires while held.
// One thumb: drag anywhere to steer and auto-fire while touching.
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio.unlock();
  if (state !== 'play') return;
  const x = logicalX(e), y = logicalY(e);
  const twoThumb = controls === 'two';
  if (!twoThumb || x < W / 2) {
    if (pointer.moveId !== null) return;
    pointer.moveId = e.pointerId; pointer.lastX = x;
    pointer.touches.set(e.pointerId, { x, y, kind: 'move' });
  } else {
    pointer.fireIds.add(e.pointerId);
    pointer.touches.set(e.pointerId, { x, y, kind: 'fire' });
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  const t = pointer.touches.get(e.pointerId);
  if (!t) return;
  t.x = logicalX(e); t.y = logicalY(e);
  if (e.pointerId !== pointer.moveId || !player) return;
  const gain = controls === 'two' ? DRAG_GAIN * 1.35 : DRAG_GAIN;   // half-screen thumb still crosses the whole field
  player.tx = clamp(player.tx + (t.x - pointer.lastX) * gain, 8, W - 8 - SHIP_W);
  pointer.lastX = t.x;
});
const release = e => {
  if (e.pointerId === pointer.moveId) pointer.moveId = null;
  pointer.fireIds.delete(e.pointerId);
  pointer.touches.delete(e.pointerId);
};
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(t, release);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('pointerdown', () => audio.unlock(), true);
document.addEventListener('touchend', () => audio.unlock(), true);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  audio.unlock();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  if (e.target.tagName === 'BUTTON' && (k === ' ' || k === 'enter')) return;
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (state === 'menu' && (k === ' ' || k === 'enter')) startGame();
  else if (state === 'play' && (k === 'p' || k === 'escape')) pauseGame();
  else if (state === 'play' && k === 'b') useBomb();
  else if (state === 'over' && k === 'c' && !$('contBtn').hidden && !$('over').classList.contains('locked')) continueGame();
  else if (state === 'paused' && ['p', 'escape', ' ', 'enter'].includes(k)) resumeGame();
  else if (state === 'scores' && ['escape', ' ', 'enter'].includes(k)) toMenu();
  else if (state === 'over' && k === ' ' && !$('over').classList.contains('locked')) startGame();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('blur', () => { if (finePointer) pauseGame(); releaseInput(); });

// ---------- boot ----------
(function buildLegend() {
  const items = [['watcherA', '#00e5ff', '30'], ['botA', '#ffe600', '20'], ['mothA', '#ff2bd6', '10'], ['carrier', '#ff2bd6', '???']];
  const el = $('legend');
  for (const [name, color, pts] of items) {
    const { url, w, h } = spriteURL(name, color, 3);
    const d = document.createElement('div'), img = new Image(), label = document.createElement('span');
    img.src = url; img.width = w; img.height = h; img.alt = '';
    label.textContent = pts;
    d.append(img, label);
    el.appendChild(d);
  }
})();
const tip = $('tip');
if (isWeChat) { tip.textContent = 'TIP: TAP ... THEN OPEN IN BROWSER'; tip.hidden = false; }
else if (isIOS && !isStandalone) { tip.textContent = 'TIP: SHARE > ADD TO HOME SCREEN FOR FULL SCREEN'; tip.hidden = false; }
syncSound();
syncControls();
$('bestVal').textContent = best;
layout();
if (document.fonts && document.fonts.load) document.fonts.load('12px "Press Start 2P"').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
