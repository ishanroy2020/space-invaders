<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Siege</title>
<meta name="description" content="A neon retro arcade shooter. Drag to move, hold to fire. Plays in your browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pixel Siege - retro arcade shooter">
<meta property="og:description" content="Tap to play in your browser. Drag to move, hold to fire. Beat my score!">
<meta property="og:url" content="https://ishanroy2020.github.io/space-invaders/">
<meta property="og:image" content="https://ishanroy2020.github.io/space-invaders/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05010f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Siege">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Press Start 2P by CodeMan38 - SIL Open Font License 1.1. Self-hosted so it also loads where Google Fonts is blocked. */
  @font-face { font-family: 'Press Start 2P'; src: url('fonts/press-start-2p.woff2') format('woff2'); font-display: swap; }
  :root {
    --bg: #05010f; --ink: #e8f7ff; --dim: #8a86b5;
    --green: #39ff14; --cyan: #00e5ff; --pink: #ff2bd6; --yellow: #ffe600; --red: #ff3355;
    --font: 'Press Start 2P', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--font);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    touch-action: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: radial-gradient(ellipse at 50% 120%, #2a0845 0%, var(--bg) 62%);
  }
  #stage { position: relative; overflow: hidden; width: 100%; height: 100%; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #crt {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0 1px, rgba(0,0,0,.2) 1px 3px),
      radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.6) 100%);
  }

  .screen {
    position: absolute; inset: 0; z-index: 3; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px 16px; text-align: center;
  }
  .screen.show { display: flex; animation: pop .22s steps(4) both; }
  .screen.dim { background: rgba(5,1,15,.8); }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  h2 { font-size: clamp(18px, 6vw, 28px); font-weight: normal; color: var(--cyan); text-shadow: 0 0 8px currentColor, 0 0 22px currentColor; line-height: 1.3; }
  h2.red { color: var(--red); }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 12px; line-height: 1; font-weight: normal; }
  .logo span { font-size: clamp(30px, 11vw, 64px); text-shadow: 0 0 6px currentColor, 0 0 26px currentColor, 4px 4px 0 #3b0a66; }
  .logo .l1 { color: var(--cyan); }
  .logo .l2 { color: var(--pink); animation: flicker 6s infinite; }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .4; } 94% { opacity: 1; } 96% { opacity: .6; } }
  .tag { font-size: 10px; color: var(--dim); letter-spacing: 2px; }
  .small { font-size: 9px; color: var(--dim); line-height: 1.9; }
  .best { font-size: 11px; color: var(--yellow); }
  .blink { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .btn {
    font: inherit; font-size: 12px; letter-spacing: 1px; color: var(--ink);
    background: rgba(255,255,255,.03); border: 3px solid currentColor;
    padding: 14px 16px; min-height: 50px; min-width: 132px; cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,229,255,.35); touch-action: manipulation;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 rgba(0,229,255,.35); }
  .btn.primary {
    color: var(--bg); background: var(--green); border-color: var(--green); font-size: 16px;
    padding: 18px 34px; min-width: 220px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--green), 0 0 30px rgba(57,255,20,.55);
  }
  .btn.primary:active { transform: scale(.97); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .locked { pointer-events: none; }
  .locked .btn { opacity: .45; }

  .legend { display: flex; gap: 22px; align-items: flex-end; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .legend div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 9px; color: var(--dim); }
  .legend img { image-rendering: pixelated; display: block; }

  #pauseBtn {
    position: absolute; top: 6px; right: 6px; z-index: 3; width: 46px; height: 46px; display: none;
    font: inherit; font-size: 12px; color: var(--ink); background: rgba(5,1,15,.35);
    border: 2px solid rgba(232,247,255,.45); touch-action: manipulation; cursor: pointer;
  }
  body[data-state="play"] #pauseBtn { display: block; }

  .kbd-only { display: none; }
  @media (hover: hover) and (pointer: fine) { .touch-only { display: none; } .kbd-only { display: block; } }

  .score-big { font-size: clamp(26px, 9vw, 44px); color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
  .badge { color: var(--pink); font-size: 11px; display: none; }
  .badge.show { display: block; }
  #saveForm { display: none; gap: 10px; align-items: stretch; }
  #saveForm.show { display: flex; }
  #nameInput {
    font: inherit; font-size: 16px; width: 9.5em; padding: 12px 10px; text-align: center; text-transform: uppercase;
    color: var(--green); background: rgba(57,255,20,.06); border: 3px solid var(--green); border-radius: 0;
    -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none;
  }
  #nameInput::placeholder { color: rgba(57,255,20,.4); }
  #saveForm .btn { min-width: 0; }
  #savedMsg { font-size: 10px; color: var(--green); min-height: 10px; }

  #scoreList { list-style: none; width: min(340px, 100%); font-size: 11px; }
  #scoreList li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 4px; border-bottom: 2px dashed rgba(138,134,181,.3); }
  #scoreList li span:first-child { color: var(--dim); width: 3ch; text-align: left; }
  #scoreList li span:nth-child(2) { flex: 1; text-align: left; }
  #scoreList li:first-child { color: var(--yellow); }
  #scoreList li.me { color: var(--green); }

  /* Short screens: phones held sideways */
  @media (max-height: 520px) {
    .screen { gap: 10px; padding: 12px 16px; }
    .logo { flex-direction: row; gap: 18px; }
    .logo span { font-size: 30px; }
    .legend, .tag, #tip { display: none; }
    h2 { font-size: 18px; }
    .score-big { font-size: 24px; }
    .btn { padding: 10px 14px; min-height: 44px; }
    .btn.primary { padding: 12px 26px; font-size: 14px; }
    #scoreList li { padding: 4px; font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.show, .logo .l2, .blink { animation: none; }
  }
</style>
</head>
<body data-state="menu">
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Game screen"></canvas>
    <div id="crt"></div>
    <button id="pauseBtn" aria-label="Pause">II</button>

    <section id="menu" class="screen show">
      <h1 class="logo"><span class="l1">PIXEL</span><span class="l2">SIEGE</span></h1>
      <p class="tag">HOLD THE LINE</p>
      <button class="btn primary" id="playBtn">PLAY</button>
      <div class="row">
        <button class="btn" id="scoresBtn">SCORES</button>
        <button class="btn" id="soundBtn">SOUND ON</button>
      </div>
      <p class="best">BEST <span id="bestVal">0</span></p>
      <p class="small touch-only">DRAG ANYWHERE TO MOVE<br>HOLD TO FIRE</p>
      <p class="small kbd-only">ARROWS OR A/D TO MOVE<br>SPACE TO FIRE - P TO PAUSE</p>
      <div class="legend" id="legend"></div>
      <p class="small" id="tip" hidden></p>
    </section>

    <section id="pause" class="screen dim">
      <h2>PAUSED</h2>
      <button class="btn primary" id="resumeBtn">RESUME</button>
      <div class="row">
        <button class="btn" id="soundBtn2">SOUND ON</button>
        <button class="btn" id="quitBtn">QUIT</button>
      </div>
    </section>

    <section id="over" class="screen dim">
      <h2 class="red">GAME OVER</h2>
      <p class="score-big" id="finalScore">0</p>
      <p class="badge" id="newBest">* NEW BEST *</p>
      <p class="small" id="waveReached"></p>
      <form id="saveForm" autocomplete="off">
        <input id="nameInput" maxlength="8" placeholder="YOUR NAME" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your name">
        <button class="btn" type="submit">SAVE</button>
      </form>
      <p id="savedMsg"></p>
      <div class="row">
        <button class="btn primary" id="againBtn">PLAY AGAIN</button>
      </div>
      <button class="btn" id="menuBtn">MENU</button>
    </section>

    <section id="scores" class="screen dim">
      <h2>HIGH SCORES</h2>
      <ol id="scoreList"></ol>
      <button class="btn" id="backBtn">BACK</button>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d', { alpha: false });
const app = $('app'), stage = $('stage');
const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';
const PIXEL = 3;
const DRAG_GAIN = 1.35;   // ship moves a little further than the finger, so short thumb swipes cover the screen
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isWeChat = /MicroMessenger/i.test(UA);
const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pad = (n, l = 6) => String(n).padStart(l, '0');
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

const store = {
  get(k, d) { try { const v = localStorage.getItem('ps_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ps_' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- sprites (original designs) ----------
const S = s => s.trim().split(/\s+/).map(r => [...r].map(Number));
const SPRITES = {
  ship:     S('00000100000 00001110000 00001010000 00011111000 10111111101 11111111111 11011111011 10000100001'),
  watcherA: S('0011111100 0111111110 1110000111 1100110011 1110000111 0111111110 0010000100 0100000010'),
  watcherB: S('0011111100 0111111110 1110000111 1101100011 1110000111 0111111110 0010000100 0001001000'),
  botA:     S('00000100000 00001110000 01111111110 01000000010 01011011010 01000000010 01111111110 00100000100'),
  botB:     S('00000000000 00000100000 01111111110 01000000010 01011011010 01000000010 01111111110 01000000010'),
  mothA:    S('1100000011 1110110111 0111111110 0011001100 0011111100 0001111000 0010000100 0100000010'),
  mothB:    S('0000000000 0000110000 1111111111 1111001111 0111111110 0001111000 0010000100 0001001000'),
  carrier:  S('0000001111000000 0000011001100000 1000111111110001 1111111111111111 0110110000110110 0010000000000100'),
  laser:    S('1 1 1 1'),
  boltA:    S('010 100 010 001 010 100'),
  boltB:    S('010 001 010 100 010 001'),
  burst:    S('00100000100 10010001001 01000100010 00011011000 01000100010 10010001001 00100000100'),
  barrier:  S('0000011111100000 0001111111111000 0111111111111110 1111111111111111 1111111111111111 0111111111111110 0001111111111000 0000011111100000'),
};
const TYPES = [
  { a: 'watcherA', b: 'watcherB', color: '#00e5ff', pts: 30 },
  { a: 'botA',     b: 'botB',     color: '#ffe600', pts: 20 },
  { a: 'mothA',    b: 'mothB',    color: '#ff2bd6', pts: 10 },
];
const SHIP_W = 11 * PIXEL, SHIP_H = 8 * PIXEL;
const POWER = {
  rapid:  { label: 'RAPID',  letter: 'R', color: '#ffe600' },
  spread: { label: 'SPREAD', letter: 'S', color: '#ff2bd6' },
  life:   { label: '1UP',    letter: '+', color: '#39ff14' },
};

// Sprites are pre-rendered once (with a neon glow) at the screen's real pixel density.
let W = 480, H = 800, renderScale = 1;
const GLOW = 5;
const cache = new Map();
function spriteCanvas(name, color, scale, glow) {
  const key = name + '|' + color + '|' + scale + '|' + glow;
  let c = cache.get(key);
  if (c) return c;
  const sp = SPRITES[name], k = scale * renderScale, p = glow ? Math.ceil(GLOW * renderScale) : 0;
  c = document.createElement('canvas');
  c.width = Math.ceil(sp[0].length * k) + p * 2;
  c.height = Math.ceil(sp.length * k) + p * 2;
  const g = c.getContext('2d');
  g.fillStyle = color;
  if (glow) { g.shadowColor = color; g.shadowBlur = 4 * renderScale; }
  for (let r = 0; r < sp.length; r++)
    for (let q = 0; q < sp[r].length; q++)
      if (sp[r][q]) g.fillRect(p + Math.floor(q * k), p + Math.floor(r * k), Math.ceil(k), Math.ceil(k));
  c.padL = p / renderScale;
  cache.set(key, c);
  return c;
}
function draw(name, x, y, color, scale = PIXEL, glow = true) {
  const c = spriteCanvas(name, color, scale, glow), rs = renderScale;
  ctx.drawImage(c, Math.round((x - c.padL) * rs) / rs, Math.round((y - c.padL) * rs) / rs, c.width / rs, c.height / rs);
}
function spriteURL(name, color, px) {
  const sp = SPRITES[name], d = Math.min(window.devicePixelRatio || 1, 3), c = document.createElement('canvas');
  c.width = sp[0].length * px * d; c.height = sp.length * px * d;
  const g = c.getContext('2d'); g.fillStyle = color;
  sp.forEach((row, r) => row.forEach((v, q) => v && g.fillRect(q * px * d, r * px * d, px * d, px * d)));
  return { url: c.toDataURL(), w: sp[0].length * px, h: sp.length * px };
}

// ---------- sound (synthesised, no files) ----------
const audio = {
  ac: null, out: null, nb: null, on: store.get('sound', true), _u: 520,
  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ac = new AC(); } catch (e) { return; }
      this.out = this.ac.createGain(); this.out.gain.value = 0.22; this.out.connect(this.ac.destination);
      const len = Math.floor(this.ac.sampleRate * 0.7);
      this.nb = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ac.state !== 'running') this.ac.resume().catch(() => {});
  },
  ok() { return this.on && this.ac && this.ac.state === 'running'; },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;
    const { type = 'square', to = 0, vol = 0.5, at = 0 } = o;
    const t = this.ac.currentTime + at, osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.out); osc.start(t); osc.stop(t + dur + 0.02);
  },
  noise(dur, o = {}) {
    if (!this.ok()) return;
    const { vol = 0.5, freq = 1800, at = 0 } = o;
    const t = this.ac.currentTime + at, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.nb; f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t); s.stop(t + dur);
  },
  shoot() { this.tone(1200, 0.07, { to: 300, vol: 0.14 }); },
  kill()  { this.noise(0.14, { vol: 0.35, freq: 4000 }); this.tone(320, 0.08, { to: 120, vol: 0.12 }); },
  die()   { this.noise(0.7, { vol: 0.7, freq: 1200 }); this.tone(220, 0.6, { type: 'sawtooth', to: 40, vol: 0.3 }); },
  ufo()   { this._u = this._u === 520 ? 660 : 520; this.tone(this._u, 0.16, { type: 'triangle', vol: 0.1 }); },
  bonus() { [880, 1320, 1760].forEach((f, i) => this.tone(f, 0.1, { vol: 0.18, at: i * 0.06 })); },
  power() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.1, { vol: 0.18, at: i * 0.06 })); },
  wave()  { [262, 330, 392, 523].forEach((f, i) => this.tone(f, 0.12, { type: 'triangle', vol: 0.25, at: i * 0.09 })); },
  over()  { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, { type: 'triangle', vol: 0.3, at: i * 0.18 })); },
  click() { this.tone(660, 0.05, { vol: 0.1 }); },
};

// ---------- layout: fill any screen (portrait, landscape, folded or unfolded) ----------
let bgGrad = null;
function layout() {
  const cs = getComputedStyle(app);
  const cw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ch = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (cw <= 0 || ch <= 0) return;
  const aspect = cw / ch;
  let nW, nH;
  if (aspect < 1) { nW = 480; nH = Math.round(clamp(480 / aspect, 600, 1040)); }
  else { nH = 600; nW = Math.round(clamp(600 * aspect, 480, 1000)); }
  const scale = Math.min(cw / nW, ch / nH);
  const dispW = Math.floor(nW * scale), dispH = Math.floor(nH * scale);
  stage.style.width = dispW + 'px';
  stage.style.height = dispH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(dispW * dpr);
  canvas.height = Math.round(dispH * dpr);
  renderScale = canvas.width / nW;
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const oldW = W, oldH = H;
  W = nW; H = nH;
  cache.clear(); bgGrad = null;
  initStars();
  onResize(oldW, oldH);
}
let layoutQueued = false;
function queueLayout() { if (!layoutQueued) { layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); } }
addEventListener('resize', queueLayout);
addEventListener('orientationchange', () => setTimeout(layout, 250));

// ---------- game state ----------
const groundY = () => H - 40;
const playerY = () => groundY() - 12 - SHIP_H;
const shieldY = () => playerY() - 78;

let state = 'menu', time = 0;
let score = 0, lives = 3, level = 1, combo = 0, best = store.get('best', 0), bestAtStart = 0;
let player = null, aliens = [], total = 0, aliveN = 0, alienDir = 1, animT = 0, animFrame = 0;
let pBullets = [], aBullets = [], shields = [], ufo = null, drops = [], booms = [], parts = [], texts = [];
let bannerT = 0, shakeT = 0, flashT = 0, respawnT = 0, overT = 0, hintT = 0, shootCD = 0;
let powers = { rapid: 0, spread: 0 };
let keys = {};
let stars = [];
const pointer = { active: false, id: null, lastX: 0 };
const mult = () => Math.min(4, 1 + Math.floor(combo / 8));

function initStars() {
  stars = [];
  const n = Math.round(W * H / 4200);
  for (let i = 0; i < n; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: Math.random() });
}

function newGame() {
  score = 0; lives = 3; level = 1; combo = 0; bestAtStart = best;
  powers = { rapid: 0, spread: 0 };
  booms = []; parts = []; texts = [];
  shakeT = flashT = respawnT = overT = 0;
  player = { x: W / 2 - SHIP_W / 2, y: playerY(), alive: true, inv: 0 };
  player.tx = player.x;
  hintT = store.get('tut', false) ? 0 : 6;
  startWave();
}

function startWave() {
  initAliens();
  initShields();
  pBullets = []; aBullets = []; drops = []; ufo = null;
  alienDir = 1; bannerT = 1.6;
  audio.wave();
}

function initAliens() {
  aliens = [];
  const cols = clamp(Math.floor((W - 120) / 42), 7, 12), rows = 5, gapX = 42, gapY = 34, cell = 33;
  const formW = (cols - 1) * gapX + cell;
  const x0 = (W - formW) / 2, y0 = 96 + Math.min(level - 1, 6) * 14;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const type = r === 0 ? 0 : r < 3 ? 1 : 2, sp = SPRITES[TYPES[type].a];
      const w = sp[0].length * PIXEL, h = sp.length * PIXEL;
      aliens.push({ x: x0 + c * gapX + (cell - w) / 2, y: y0 + r * gapY, w, h, type, col: c, alive: true });
    }
  }
  total = aliveN = aliens.length;
  animFrame = 0; animT = 0;
}

function initShields() {
  const n = W >= 760 ? 5 : 4;
  shields = [];
  for (let i = 0; i < n; i++) shields.push({ grid: SPRITES.barrier.map(r => r.slice()), x: 0, y: 0, w: 16 * PIXEL, h: 8 * PIXEL });
  placeShields();
}
function placeShields() {
  const n = shields.length, sp = W / n;
  shields.forEach((s, i) => { s.x = Math.round(sp * (i + 0.5) - s.w / 2); s.y = shieldY(); });
}

function onResize(oldW, oldH) {
  if (!player) return;
  const oldPY = oldH - 40 - 12 - SHIP_H;
  player.y = playerY();
  player.x = clamp(player.x + (W - oldW) / 2, 8, W - 8 - SHIP_W);
  player.tx = player.x;
  if (aliens.length) {
    let minX = Infinity, maxX = -Infinity;
    for (const a of aliens) { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); }
    const fw = maxX - minX, avail = W - 24, k = fw > avail ? avail / fw : 1, nx0 = (W - fw * k) / 2;
    const ky = (playerY() - 90) / Math.max(1, oldPY - 90);
    for (const a of aliens) { a.x = nx0 + (a.x - minX) * k; a.y = 90 + (a.y - 90) * ky; }
  }
  placeShields();
  pBullets.length = 0; aBullets.length = 0;
  for (const d of drops) d.x = clamp(d.x, 0, W - d.w);
}

// ---------- gameplay ----------
function fire() {
  const rapid = powers.rapid > 0, spread = powers.spread > 0;
  const maxB = (rapid ? 8 : 3) * (spread ? 3 : 1);
  if (shootCD > 0 || pBullets.length >= maxB) return;
  const cx = player.x + SHIP_W / 2 - 1.5, y = player.y - 10;
  if (spread) for (const dx of [-140, 0, 140]) pBullets.push({ x: cx, y, dx, dy: -520 });
  else pBullets.push({ x: cx, y, dx: 0, dy: -560 });
  shootCD = rapid ? (spread ? 0.16 : 0.1) : (spread ? 0.32 : 0.3);
  audio.shoot();
}

function update(dt) {
  if (bannerT > 0) bannerT -= dt;
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) store.set('tut', true); }
  shootCD -= dt;
  powers.rapid = Math.max(0, powers.rapid - dt);
  powers.spread = Math.max(0, powers.spread - dt);

  // Player
  if (player.alive) {
    const dir = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    if (dir) player.tx = player.x + dir * 330 * dt;
    player.tx = clamp(player.tx, 8, W - 8 - SHIP_W);
    if (dir) player.x = player.tx;
    else player.x += (player.tx - player.x) * Math.min(1, dt * 22);
    if (player.inv > 0) player.inv -= dt;
    if (pointer.active || keys[' ']) fire();
  } else if (lives > 0) {
    respawnT -= dt;
    if (respawnT <= 0) { player.alive = true; player.inv = 2; aBullets.length = 0; }
  } else {
    overT -= dt;
    if (overT <= 0) { gameOver(); return; }
  }

  // Bullets
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    b.x += b.dx * dt; b.y += b.dy * dt;
    if (b.y < 28 || b.x < -10 || b.x > W + 10) { pBullets.splice(i, 1); combo = 0; }
  }
  const abv = Math.min(420, 200 + level * 18);
  for (let i = aBullets.length - 1; i >= 0; i--) {
    const b = aBullets[i];
    b.y += abv * dt; b.t += dt;
    if (b.y + 18 > groundY()) { sparks(b.x + 4, groundY(), '#ff3355', 4); aBullets.splice(i, 1); }
  }

  // Enemies
  if (bannerT <= 0) { moveAliens(dt); alienShoot(dt); spawnUfo(dt); }
  animT += dt;
  if (animT > Math.max(0.12, 0.55 - (1 - aliveN / total) * 0.4)) { animT = 0; animFrame ^= 1; }
  if (ufo) {
    ufo.x += ufo.dx * dt; ufo.snd -= dt;
    if (ufo.snd <= 0) { audio.ufo(); ufo.snd = 0.18; }
    if (ufo.x < -70 || ufo.x > W + 70) ufo = null;
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    drops[i].y += 95 * dt; drops[i].t += dt;
    if (drops[i].y > groundY()) drops.splice(i, 1);
  }

  collisions();

  if (aliveN === 0 && state === 'play') {
    const bonus = 200 * level;
    score += bonus; bumpBest();
    text(W / 2, shieldY() - 30, 'WAVE CLEAR +' + bonus, '#39ff14', 12);
    level++;
    startWave();
  }
}

function moveAliens(dt) {
  if (!aliveN) return;
  const killed = total - aliveN;
  const sp = Math.min(380, (52 + (level - 1) * 9) * (1 + 2.6 * Math.pow(killed / total, 1.7)));
  const dx = alienDir * sp * dt;
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  for (const a of aliens) if (a.alive) { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); maxY = Math.max(maxY, a.y + a.h); }
  if ((alienDir > 0 && maxX + dx > W - 10) || (alienDir < 0 && minX + dx < 10)) {
    alienDir *= -1;
    for (const a of aliens) a.y += 14;
    maxY += 14;
  } else {
    for (const a of aliens) a.x += dx;
  }
  if (maxY >= player.y && lives > 0) invasion();
}

function alienShoot(dt) {
  const maxB = Math.min(6, 2 + Math.floor(level / 2));
  if (aBullets.length >= maxB || Math.random() > (0.9 + level * 0.25) * dt) return;
  const bottoms = {};
  for (const a of aliens) if (a.alive && (!bottoms[a.col] || a.y > bottoms[a.col].y)) bottoms[a.col] = a;
  const list = Object.values(bottoms);
  if (!list.length) return;
  let s;
  if (Math.random() < 0.4) {
    const px = player.x + SHIP_W / 2;
    s = list.reduce((m, a) => Math.abs(a.x + a.w / 2 - px) < Math.abs(m.x + m.w / 2 - px) ? a : m);
  } else s = list[Math.floor(Math.random() * list.length)];
  aBullets.push({ x: s.x + s.w / 2 - 4.5, y: s.y + s.h, t: 0 });
}

function spawnUfo(dt) {
  if (ufo || Math.random() > dt / 13) return;
  const dir = Math.random() < 0.5 ? 1 : -1;
  ufo = { x: dir > 0 ? -50 : W + 2, y: 62, w: 48, h: 18, dx: dir * (105 + level * 8), pts: [100, 150, 200, 300][Math.floor(Math.random() * 4)], snd: 0 };
}

function collisions() {
  outer:
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i], br = { x: b.x, y: b.y, w: 3, h: 12 };
    for (const a of aliens) {
      if (a.alive && hit(br, a)) { killAlien(a); pBullets.splice(i, 1); continue outer; }
    }
    if (ufo && hit(br, ufo)) { killUfo(); pBullets.splice(i, 1); continue; }
    if (damageShield(br)) { pBullets.splice(i, 1); combo = 0; }
  }
  for (let i = aBullets.length - 1; i >= 0; i--) {
    const b = aBullets[i], br = { x: b.x, y: b.y, w: 9, h: 18 };
    if (damageShield(br)) { aBullets.splice(i, 1); continue; }
    if (player.alive && player.inv <= 0 && hit(br, { x: player.x + 4, y: player.y + 6, w: SHIP_W - 8, h: SHIP_H - 6 })) {
      aBullets.splice(i, 1); playerHit();
    }
  }
  const sy = shieldY();
  for (const a of aliens) {
    if (!a.alive || a.y + a.h < sy) continue;
    for (const s of shields) if (hit(a, s)) eraseShield(s, a);
  }
  if (player.alive) {
    const pr = { x: player.x - 6, y: player.y - 6, w: SHIP_W + 12, h: SHIP_H + 12 };
    for (let i = drops.length - 1; i >= 0; i--) if (hit(drops[i], pr)) { collect(drops[i]); drops.splice(i, 1); }
  }
}

function damageShield(br) {
  for (const s of shields) {
    if (!hit(br, s)) continue;
    const cols = s.grid[0].length, rows = s.grid.length;
    const c0 = Math.max(0, Math.floor((br.x - s.x) / PIXEL)), c1 = Math.min(cols - 1, Math.floor((br.x + br.w - 0.01 - s.x) / PIXEL));
    const r0 = Math.max(0, Math.floor((br.y - s.y) / PIXEL)), r1 = Math.min(rows - 1, Math.floor((br.y + br.h - 0.01 - s.y) / PIXEL));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (!s.grid[r][c]) continue;
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || cc < 0 || rr >= rows || cc >= cols) continue;
          const d = dr * dr + dc * dc;
          if (d === 0 || (d <= 4 && Math.random() < 0.75)) s.grid[rr][cc] = 0;
        }
        sparks(s.x + c * PIXEL, s.y + r * PIXEL, '#39ff14', 3);
        return true;
      }
    }
  }
  return false;
}

function eraseShield(s, a) {
  for (let r = 0; r < s.grid.length; r++) for (let c = 0; c < s.grid[r].length; c++) {
    const px = s.x + c * PIXEL, py = s.y + r * PIXEL;
    if (px < a.x + a.w && px + PIXEL > a.x && py < a.y + a.h && py + PIXEL > a.y) s.grid[r][c] = 0;
  }
}

function killAlien(a) {
  a.alive = false; aliveN--; combo++;
  const m = mult(), t = TYPES[a.type];
  score += t.pts * m; bumpBest();
  boom(a.x + a.w / 2, a.y + a.h / 2, t.color, 1);
  audio.kill();
  if (m > 1 && combo % 8 === 0) text(a.x + a.w / 2, a.y, 'x' + m + ' COMBO', '#ff2bd6', 10);
  if (Math.random() < 0.03) drop(a.x + a.w / 2, a.y);
}

function killUfo() {
  score += ufo.pts; bumpBest();
  boom(ufo.x + ufo.w / 2, ufo.y + ufo.h / 2, '#ff2bd6', 1.6);
  text(ufo.x + ufo.w / 2, ufo.y, '+' + ufo.pts, '#ffe600', 12);
  drop(ufo.x + ufo.w / 2, ufo.y + ufo.h);
  audio.bonus(); buzz(25);
  ufo = null;
}

function drop(x, y) {
  const r = Math.random(), type = r < 0.45 ? 'rapid' : r < 0.85 ? 'spread' : 'life';
  drops.push({ x: x - 10, y, w: 20, h: 20, type, t: 0 });
}

function collect(d) {
  const p = POWER[d.type];
  if (d.type === 'life') {
    if (lives < 5) lives++; else { score += 500; bumpBest(); }
  } else powers[d.type] = 9;
  text(player.x + SHIP_W / 2, player.y - 16, p.label + '!', p.color, 12);
  audio.power(); buzz(30);
}

function playerHit() {
  player.alive = false; lives--; combo = 0;
  powers.rapid = powers.spread = 0;
  boom(player.x + SHIP_W / 2, player.y + SHIP_H / 2, '#39ff14', 2.2);
  shakeT = 0.45; flashT = 0.25;
  audio.die(); buzz([60, 40, 120]);
  if (lives > 0) respawnT = 1.4; else overT = 1.3;
}

function invasion() {
  lives = 1;
  if (player.alive) playerHit(); else { lives = 0; overT = 1.3; }
}

function bumpBest() { if (score > best) best = score; }

// ---------- effects ----------
function boom(x, y, color, size) {
  booms.push({ x, y, color, t: 0, size });
  sparks(x, y, color, Math.round(14 * size), 220 * size);
}
function sparks(x, y, color, n, v = 160) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, Math.PI * 2), sp = rand(30, v), life = rand(0.35, 0.9);
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life, max: life, color, s: rand(1.5, 3.5) });
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}
function text(x, y, str, color, size) { texts.push({ x, y, str, color, size, life: 1.2 }); }

function updateFx(dt) {
  if (shakeT > 0) shakeT -= dt;
  if (flashT > 0) flashT -= dt;
  for (let i = booms.length - 1; i >= 0; i--) if ((booms[i].t += dt) > 0.32) booms.splice(i, 1);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; p.vx *= 0.98;
    if ((p.life -= dt) <= 0) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.y -= 26 * dt;
    if ((t.life -= dt) <= 0) texts.splice(i, 1);
  }
}

// ---------- rendering ----------
function drawBackground(dt) {
  ctx.fillStyle = '#05010f';
  ctx.fillRect(0, 0, W, H);
  if (!bgGrad) {
    bgGrad = ctx.createLinearGradient(0, H * 0.5, 0, H);
    bgGrad.addColorStop(0, 'rgba(120,20,160,0)');
    bgGrad.addColorStop(1, 'rgba(120,20,160,0.32)');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);
  for (const s of stars) {
    s.y += (8 + s.z * 34) * dt;
    if (s.y > H) { s.y = 0; s.x = rand(0, W); }
    ctx.globalAlpha = clamp(0.25 + s.z * 0.6 + Math.sin(time * 3 + s.x) * 0.15, 0, 1);
    ctx.fillStyle = s.z > 0.85 ? '#9ff' : '#fff';
    const sz = s.z > 0.7 ? 2 : 1;
    ctx.fillRect(s.x, s.y, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawGrid() {
  const hz = H * 0.72, vp = W / 2;
  ctx.strokeStyle = 'rgba(255,43,214,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = -14; i <= 14; i++) { ctx.moveTo(vp + i * 10, hz); ctx.lineTo(vp + i * W * 0.16, H); }
  const off = reduceMotion ? 0 : (time * 0.5) % 1;
  for (let i = 0; i < 10; i++) { const p = (i + off) / 10, y = hz + (H - hz) * p * p; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,43,214,.7)';
  ctx.fillRect(0, hz, W, 2);
}

function glowText(str, x, y, color, size, align = 'center') {
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

function drawWorld() {
  // Barriers
  ctx.fillStyle = '#39ff14';
  ctx.globalAlpha = 0.9;
  for (const s of shields)
    for (let r = 0; r < s.grid.length; r++)
      for (let c = 0; c < s.grid[r].length; c++)
        if (s.grid[r][c]) ctx.fillRect(s.x + c * PIXEL, s.y + r * PIXEL, PIXEL + 0.05, PIXEL + 0.05);
  ctx.globalAlpha = 1;

  // Invaders
  for (const a of aliens) {
    if (!a.alive) continue;
    const t = TYPES[a.type];
    draw(animFrame ? t.b : t.a, a.x, a.y, t.color);
  }
  if (ufo) draw('carrier', ufo.x, ufo.y, '#ff2bd6');

  // Power-up capsules
  ctx.textBaseline = 'middle';
  for (const d of drops) {
    const p = POWER[d.type], pulse = 0.6 + Math.sin(d.t * 10) * 0.4;
    ctx.strokeStyle = p.color; ctx.lineWidth = 2;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10 * pulse;
    ctx.strokeRect(d.x + 1, d.y + 1, d.w - 2, d.h - 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = p.color; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(p.letter, d.x + d.w / 2 + 0.5, d.y + d.h / 2 + 1);
  }

  // Bullets
  for (const b of pBullets) draw('laser', b.x, b.y, '#bff');
  for (const b of aBullets) draw(Math.floor(b.t * 8) % 2 ? 'boltA' : 'boltB', b.x, b.y, '#ff3355');

  // Player
  if (player && player.alive && !(player.inv > 0 && Math.floor(player.inv * 12) % 2)) {
    const fx = player.x + SHIP_W / 2 - 1.5;
    ctx.fillStyle = Math.floor(time * 20) % 2 ? '#ffe600' : '#ff8a00';
    ctx.fillRect(fx, player.y + SHIP_H, 3, 3 + Math.random() * 4);
    draw('ship', player.x, player.y, '#39ff14');
  }

  // Explosions and particles
  for (const b of booms) {
    ctx.globalAlpha = 1 - b.t / 0.32;
    const sc = PIXEL * b.size;
    draw('burst', b.x - 5.5 * sc, b.y - 3.5 * sc, b.color, sc);
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life * 1.5, 0, 1);
    glowText(t.str, t.x, t.y, t.color, t.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = '8px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('SCORE', 12, 12);
  ctx.font = '14px ' + FONT; ctx.fillStyle = '#e8f7ff';
  ctx.fillText(pad(score), 12, 26);
  const m = mult();
  if (m > 1) { ctx.font = '10px ' + FONT; ctx.fillStyle = '#ff2bd6'; ctx.fillText('x' + m, 104, 28); }
  ctx.textAlign = 'center';
  ctx.font = '8px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('BEST', W / 2 + 24, 12);
  ctx.font = '14px ' + FONT; ctx.fillStyle = '#ffe600';
  ctx.fillText(pad(best), W / 2 + 24, 26);

  // Ground, lives, wave, power timers
  const gy = groundY();
  ctx.fillStyle = '#39ff14';
  ctx.fillRect(0, gy, W, 2);
  for (let i = 0; i < lives; i++) draw('ship', 12 + i * 28, gy + 12, '#39ff14', 2, false);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = '8px ' + FONT; ctx.fillStyle = '#8a86b5';
  ctx.fillText('WAVE ' + level, W - 12, gy + 20);
  let px = W / 2 - 40;
  for (const k of ['rapid', 'spread']) {
    if (powers[k] <= 0) continue;
    const p = POWER[k];
    ctx.fillStyle = p.color; ctx.textAlign = 'left'; ctx.font = '7px ' + FONT;
    ctx.fillText(p.letter, px, gy + 20);
    ctx.globalAlpha = powers[k] < 2 && Math.floor(time * 8) % 2 ? 0.3 : 1;
    ctx.fillRect(px + 10, gy + 17, 26 * (powers[k] / 9), 5);
    ctx.globalAlpha = 1;
    px += 44;
  }
}

function drawBanner() {
  if (bannerT <= 0) return;
  ctx.globalAlpha = Math.min(1, bannerT * 3);
  ctx.textBaseline = 'middle';
  const y = shieldY() - 70;
  glowText('WAVE ' + level, W / 2, y, '#00e5ff', 22);
  if (Math.floor(time * 4) % 2 === 0) glowText('GET READY', W / 2, y + 30, '#ffe600', 10);
  ctx.globalAlpha = 1;
}

function drawHint() {
  if (hintT <= 0 || !player) return;
  ctx.globalAlpha = Math.min(1, hintT);
  ctx.textBaseline = 'middle';
  const y = shieldY() - 22;
  if (finePointer) {
    glowText('ARROWS OR A/D TO MOVE', W / 2, y, '#e8f7ff', 9);
    glowText('SPACE TO FIRE', W / 2, y + 16, '#e8f7ff', 9);
  } else {
    glowText('DRAG ANYWHERE TO MOVE', W / 2, y, '#e8f7ff', 9);
    glowText('HOLD TO FIRE', W / 2, y + 16, '#e8f7ff', 9);
    // Animated "finger" showing the swipe
    const fx = W / 2 + Math.sin(time * 2.4) * 70, fy = playerY() + SHIP_H + 4;
    ctx.strokeStyle = 'rgba(232,247,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fx, fy, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(232,247,255,.25)';
    ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI * 2); ctx.fill();
    glowText('<', W / 2 - 100, fy, '#e8f7ff', 10);
    glowText('>', W / 2 + 100, fy, '#e8f7ff', 10);
  }
  ctx.globalAlpha = 1;
}

function render(dt) {
  drawBackground(state === 'paused' ? 0 : dt);
  if (state === 'menu' || state === 'scores' || !player) { drawGrid(); return; }
  ctx.save();
  if (shakeT > 0 && !reduceMotion) { const m = shakeT * 14; ctx.translate(rand(-m, m), rand(-m, m)); }
  drawWorld();
  ctx.restore();
  drawHUD();
  drawBanner();
  drawHint();
  if (flashT > 0) { ctx.fillStyle = 'rgba(255,51,85,' + (flashT * 1.2) + ')'; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (state !== 'paused') time += dt;
  if (state === 'play') { update(dt); updateFx(dt); }
  else if (state === 'over') updateFx(dt);
  render(dt);
  requestAnimationFrame(frame);
}

// ---------- screens ----------
const screens = ['menu', 'pause', 'over', 'scores'];
function showScreen(id) { for (const s of screens) $(s).classList.toggle('show', s === id); }
function setState(s) { state = s; document.body.dataset.state = s; }
function releaseInput() { pointer.active = false; pointer.id = null; keys = {}; }

function toMenu() {
  setState('menu'); releaseInput();
  $('bestVal').textContent = best;
  showScreen('menu');
}
function startGame() {
  audio.unlock();
  releaseInput();
  newGame();
  setState('play');
  showScreen(null);
}
function pauseGame() {
  if (state !== 'play') return;
  setState('paused'); releaseInput();
  showScreen('pause');
}
function resumeGame() {
  if (state !== 'paused') return;
  setState('play');
  showScreen(null);
  last = performance.now();
}
function gameOver() {
  setState('over'); releaseInput();
  store.set('best', best);
  audio.over();
  $('finalScore').textContent = score;
  $('newBest').classList.toggle('show', score > bestAtStart && score > 0);
  $('waveReached').textContent = 'REACHED WAVE ' + level;
  const list = getScores();
  const qualifies = score > 0 && (list.length < 10 || score > list[list.length - 1].s);
  $('saveForm').classList.toggle('show', qualifies);
  $('nameInput').value = store.get('name', '');
  $('savedMsg').textContent = '';
  const over = $('over');
  over.classList.add('locked');          // stop a finger still on the screen from tapping PLAY AGAIN
  setTimeout(() => over.classList.remove('locked'), 800);
  showScreen('over');
}

function getScores() {
  const v = store.get('scores', []);
  return Array.isArray(v) ? v.filter(x => x && typeof x.s === 'number').slice(0, 10) : [];
}
let lastSaved = null;
function saveScore(e) {
  e.preventDefault();
  const input = $('nameInput');
  const name = (input.value || '').toUpperCase().replace(/[^A-Z0-9 ._-]/g, '').trim().slice(0, 8) || 'PLAYER';
  store.set('name', name);
  const entry = { n: name, s: score, w: level, id: Date.now() };
  const list = getScores();
  list.push(entry);
  list.sort((a, b) => b.s - a.s);
  const top = list.slice(0, 10);
  store.set('scores', top);
  lastSaved = entry.id;
  input.blur();
  window.scrollTo(0, 0);
  $('saveForm').classList.remove('show');
  $('savedMsg').textContent = 'SAVED - RANK #' + (top.findIndex(x => x.id === entry.id) + 1);
  audio.power();
}
function showScores() {
  setState('scores');
  const ol = $('scoreList');
  ol.textContent = '';
  const list = getScores();
  if (!list.length) {
    const li = document.createElement('li');
    li.textContent = 'NO SCORES YET';
    ol.appendChild(li);
  }
  list.forEach((s, i) => {
    const li = document.createElement('li');
    if (s.id === lastSaved) li.className = 'me';
    for (const t of [(i + 1) + '.', s.n, String(s.s)]) {
      const span = document.createElement('span');
      span.textContent = t;
      li.appendChild(span);
    }
    ol.appendChild(li);
  });
  showScreen('scores');
}
function toggleSound() {
  audio.on = !audio.on;
  store.set('sound', audio.on);
  syncSound();
  audio.click();
}
function syncSound() { for (const id of ['soundBtn', 'soundBtn2']) $(id).textContent = audio.on ? 'SOUND ON' : 'SOUND OFF'; }

const on = (id, fn) => $(id).addEventListener('click', e => { audio.unlock(); e.currentTarget.blur(); audio.click(); fn(); });
on('playBtn', startGame);
on('scoresBtn', showScores);
on('soundBtn', toggleSound);
on('soundBtn2', toggleSound);
on('resumeBtn', resumeGame);
on('quitBtn', toMenu);
on('againBtn', startGame);
on('menuBtn', toMenu);
on('backBtn', toMenu);
on('pauseBtn', pauseGame);
$('saveForm').addEventListener('submit', saveScore);
$('nameInput').addEventListener('blur', () => window.scrollTo(0, 0));

// ---------- input ----------
function logicalX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio.unlock();
  if (state !== 'play' || pointer.active) return;
  pointer.active = true; pointer.id = e.pointerId; pointer.lastX = logicalX(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (!pointer.active || e.pointerId !== pointer.id || !player) return;
  const x = logicalX(e);
  player.tx = clamp(player.tx + (x - pointer.lastX) * DRAG_GAIN, 8, W - 8 - SHIP_W);
  pointer.lastX = x;
});
const release = e => { if (e.pointerId === pointer.id) { pointer.active = false; pointer.id = null; } };
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(t, release);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('pointerdown', () => audio.unlock(), true);
document.addEventListener('touchend', () => audio.unlock(), true);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  audio.unlock();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  if (e.target.tagName === 'BUTTON' && (k === ' ' || k === 'enter')) return;
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (state === 'menu' && (k === ' ' || k === 'enter')) startGame();
  else if (state === 'play' && (k === 'p' || k === 'escape')) pauseGame();
  else if (state === 'paused' && ['p', 'escape', ' ', 'enter'].includes(k)) resumeGame();
  else if (state === 'scores' && ['escape', ' ', 'enter'].includes(k)) toMenu();
  else if (state === 'over' && k === ' ' && !$('over').classList.contains('locked')) startGame();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('blur', () => { if (finePointer) pauseGame(); releaseInput(); });

// ---------- boot ----------
(function buildLegend() {
  const items = [['watcherA', '#00e5ff', '30'], ['botA', '#ffe600', '20'], ['mothA', '#ff2bd6', '10'], ['carrier', '#ff2bd6', '???']];
  const el = $('legend');
  for (const [name, color, pts] of items) {
    const { url, w, h } = spriteURL(name, color, 3);
    const d = document.createElement('div'), img = new Image(), label = document.createElement('span');
    img.src = url; img.width = w; img.height = h; img.alt = '';
    label.textContent = pts;
    d.append(img, label);
    el.appendChild(d);
  }
})();
const tip = $('tip');
if (isWeChat) { tip.textContent = 'TIP: TAP ... THEN OPEN IN BROWSER'; tip.hidden = false; }
else if (isIOS && !isStandalone) { tip.textContent = 'TIP: SHARE > ADD TO HOME SCREEN FOR FULL SCREEN'; tip.hidden = false; }
syncSound();
$('bestVal').textContent = best;
layout();
if (document.fonts && document.fonts.load) document.fonts.load('12px "Press Start 2P"').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
